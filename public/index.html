<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diario de la Salud — EcoFarma</title>
  <script defer src="/alpine.min.js"></script>
  <style>
    /* ══════════════════════════════════════════════════════════════════
       2026-07-17: restyle puramente visual sobre el estilo de
       annexe-html-03-dashboard-diario-salud-v3-modern.html -- mismos
       nombres de clase que ya usan index.html y sections/*.html, solo
       cambian los valores de diseno (colores, radios, sombras,
       tipografia) y la estructura del shell (sidebar en vez de tabs
       horizontales). Ninguna funcionalidad, binding de Alpine o llamada
       a la API cambio. (sections/ tenia 5 archivos al momento de este
       restyle -- cola/triage/publicar se fusionaron despues en
       articulos.html, ver su comentario de cabecera.)
       ══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f4f7fb;
      --panel:#ffffff;
      --panel-soft:#f8fafc;
      --ink:#152033;
      --muted:#64748b;
      --subtle:#94a3b8;
      --line:#e4eaf1;
      --line-strong:#d7dee8;

      --primary:#0f6b5b;
      --primary-dark:#0a5549;
      --primary-light:#e9f6f2;

      --green:#17643b;      --green-bg:#ebf8f0;      --green-border:#ccebd8;
      --amber:#a65b12;      --amber-bg:#fff6e8;      --amber-border:#f3dfbd;
      --red:#b42318;        --red-bg:#fff0ef;        --red-border:#f2d1ce;
      --blue:#245f91;       --blue-bg:#edf5fb;
      --orange:#a65b12;     --orange-bg:#fff6e8;

      --fs-xs:  11px;
      --fs-sm:  13px;
      --fs-md:  15px;
      --fs-lg:  22px;
      --radius:    12px;
      --radius-lg: 18px;
      --shadow:    0 1px 2px rgba(15,23,42,.04);
      --shadow-md: 0 12px 30px rgba(15,23,42,.09);
    }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(36,95,145,.06), transparent 32%),
        var(--bg);
      color: var(--ink); font-size: var(--fs-sm); line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    [x-cloak] { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-dot {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(15,107,91,.35); }
      60%      { opacity:.8; box-shadow: 0 0 0 5px rgba(15,107,91,0); }
    }
    @keyframes toast-in { from { transform: translate(-50%,8px); opacity:0; } to { transform: translate(-50%,0); opacity:1; } }

    /* ── Shell: sidebar + main (reemplaza header/tabs horizontales) ──── */
    .app { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 18px; align-items: start; max-width: 1480px; margin: 0 auto; padding: 22px; }

    .sidebar {
      position: sticky; top: 22px; min-height: calc(100vh - 44px);
      background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); padding: 18px 14px; display: flex; flex-direction: column;
    }
    .brand { padding: 8px 10px 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .brand .header-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -.03em; color: var(--ink); }
    .brand .header-logo svg { width: 19px; height: 19px; color: var(--primary); }
    .brand p { margin: 7px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
    .header-role { display: inline-block; margin-top: 6px; color: var(--subtle); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }

    .nav-title { margin: 4px 10px 9px; color: var(--subtle); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
    .tabs { display: grid; gap: 6px; }
    .tab {
      width: 100%; text-align: left; color: #334155; border: 1px solid transparent; border-radius: 11px;
      padding: 10px 12px; font-size: 13.5px; font-weight: 650; background: transparent; cursor: pointer;
      transition: .18s ease; display: flex; align-items: center; gap: 8px;
    }
    .tab svg { opacity: .6; flex-shrink: 0; transition: opacity .15s; }
    .tab:hover { background: var(--panel-soft); color: var(--ink); }
    .tab:hover svg { opacity: .85; }
    .tab.active { border-color: #cfe8e1; background: var(--primary-light); color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); font-weight: 700; }
    .tab.active svg { opacity: 1; }
    .tab-badge { display: inline-flex; align-items: center; justify-content: center; margin-left: auto; background: var(--red); color: #fff; font-size: 9.5px; font-weight: 800; border-radius: 999px; min-width: 16px; height: 16px; padding: 0 4px; }
    .tab.active .tab-badge { background: rgba(15,107,91,.16); color: var(--primary); }
    .tab-badge-count { background: var(--line); color: var(--muted); }
    .tab.active .tab-badge-count { background: rgba(15,107,91,.14); color: var(--primary); }
    .tabs-spacer { display: none; }

    .sidebar-foot { margin-top: auto; padding-top: 18px; }
    .header-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); padding: 9px 10px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
    .dot:not(.err) { animation: pulse-dot 2.8s ease-in-out infinite; }
    .dot.err { background: var(--red); animation: none; }
    .btn-ghost {
      width: 100%; background: var(--panel-soft); border: 1px solid var(--line); color: #475569;
      padding: 9px 12px; border-radius: 11px; cursor: pointer; font-size: 12.5px; font-weight: 700;
      transition: .16s ease; margin-top: 6px; text-align: left;
    }
    .btn-ghost:hover { background: #fff; border-color: var(--line-strong); }

    .main { min-width: 0; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 22px; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }

    .guide-section { margin-bottom: 28px; }
    .guide-section:last-child { margin-bottom: 0; }
    .guide-h2 { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .guide-h2 svg { flex-shrink: 0; color: var(--primary); }
    .guide-p { font-size: var(--fs-sm); color: var(--muted); line-height: 1.7; margin-bottom: 8px; }
    .guide-steps { list-style: none; counter-reset: step; }
    .guide-steps li { counter-increment: step; position: relative; padding-left: 34px; margin-bottom: 10px; font-size: var(--fs-sm); color: var(--ink); }
    .guide-steps li::before { content: counter(step); position: absolute; left: 0; top: 1px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; }
    .guide-tip { background: var(--blue-bg); border: 1px solid #cfe0ef; border-radius: 13px; padding: 10px 14px; font-size: 12px; color: var(--blue); display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
    .guide-tip svg { flex-shrink: 0; margin-top: 1px; }
    .guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
    .guide-card { background: var(--panel-soft); border: 1px solid var(--line); border-radius: 13px; padding: 14px; }
    .guide-card-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: #fff; margin-bottom: 8px; }
    .guide-card-title { font-size: var(--fs-xs); font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .guide-card-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }

    /* ── Login ─────────────────────────────────────────────────────── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top right, rgba(36,95,145,.08), transparent 32%), var(--bg);
    }
    .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-md); }
    .login-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: var(--fs-lg); letter-spacing: -.03em; margin-bottom: 8px; }
    .login-logo svg { width: 22px; height: 22px; color: var(--primary); }
    .login-eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); margin-bottom: 20px; }
    .login-sub { font-size: var(--fs-sm); color: var(--muted); margin-top: -14px; margin-bottom: 28px; }
    .login-help { font-size: var(--fs-xs); color: var(--subtle); margin-top: 20px; text-align: center; }
    .login-footer { font-size: 10px; color: var(--subtle); margin-top: 28px; text-align: center; border-top: 1px solid var(--line); padding-top: 16px; }

    .field { margin-bottom: 16px; }
    .label { display: block; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .input {
      width: 100%; padding: 10px 13px; border: 1px solid var(--line-strong); border-radius: 11px;
      font-size: 13.5px; background: #fff; color: var(--ink); outline: none; font-family: inherit;
      box-shadow: inset 0 1px 2px rgba(15,23,42,.02); transition: .18s ease;
    }
    .input::placeholder { color: var(--subtle); }
    .input:focus { border-color: #9ccdc1; box-shadow: 0 0 0 4px rgba(15,107,91,.08); }
    .textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 38px; padding: 9px 15px; border: 1px solid var(--line-strong); background: #fff;
      color: #334155; border-radius: 10px; font-size: 13px; font-weight: 750; cursor: pointer;
      box-shadow: 0 1px 2px rgba(15,23,42,.03); transition: .16s ease; font-family: inherit;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #c8d2de; box-shadow: 0 6px 14px rgba(15,23,42,.06); }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 8px 18px rgba(15,107,91,.16); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-secondary { background: var(--primary-light); border-color: #cfe8e1; color: var(--primary); }
    .btn-secondary:hover:not(:disabled) { background: #dcf1ea; }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .btn-danger:hover:not(:disabled) { background: #ffe3e0; }
    .btn-amber { background: var(--amber); border-color: var(--amber); color: #fff; }
    .btn-amber:hover:not(:disabled) { background: #8a4c0e; border-color: #8a4c0e; }
    .btn-sm { min-height: 32px; padding: 6px 11px; font-size: var(--fs-xs); }
    .btn-full { width: 100%; }
    .error-msg { display: flex; align-items: center; gap: 8px; background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); border-radius: 11px; padding: 10px 12px; font-size: var(--fs-xs); margin-top: 12px; }

    /* ── Tarjetas / secciones ──────────────────────────────────────── */
    .card { background: #fff; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; box-shadow: 0 5px 16px rgba(15,23,42,.035); }
    .card + .card { margin-top: 14px; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--panel-soft); }
    .card-title { font-size: var(--fs-sm); font-weight: 750; color: var(--ink); }
    .card-body { padding: 20px; }
    .section-title { font-size: 27px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.03em; color: var(--ink); }
    .section-sub { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 20px; max-width: 760px; }

    /* ── Tablas ────────────────────────────────────────────────────── */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 13px; }
    .table-scroll .table { min-width: 560px; }
    .table-wide .table { min-width: 1500px; }
    .table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .table th { text-align: left; font-size: 10.5px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: .075em; padding: 12px 14px; background: #f7f9fc; border-bottom: 1px solid var(--line); }
    .table td { padding: 12px 14px; border-bottom: 1px solid #edf1f5; font-size: 13px; vertical-align: middle; color: #334155; background: #fff; }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: #f8fbfa; }

    /* ── Badges / etiquetas (mismo nombre, look tipo "tag" del anexo) ─ */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; border: 1px solid transparent; }
    .badge-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
    .badge-red    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
    .badge-amber  { background: var(--amber-bg);  color: var(--amber);  border-color: var(--amber-border); }
    .badge-blue   { background: var(--blue-bg);   color: var(--blue);   border-color: #d7e6f3; }
    .badge-gray   { background: #f1f4f7;          color: #556274;       border-color: #e0e6ed; }
    .badge-orange { background: var(--orange-bg); color: var(--orange); border-color: var(--amber-border); }

    .empty { padding: 48px 20px; text-align: center; color: var(--subtle); }
    .empty svg { width: 40px; height: 40px; margin: 0 auto 14px; opacity: .25; }
    .empty p { font-size: var(--fs-sm); line-height: 1.6; }

    /* ── Filas de articulo (cards expandibles, mismo patron de hover
       que las filas de tabla del anexo) ──────────────────────────── */
    .article-row { padding: 15px 20px; border-bottom: 1px solid #edf1f5; cursor: pointer; transition: background .12s; }
    .article-row:last-child { border-bottom: none; }
    .article-row:hover { background: #f8fbfa; }
    .article-row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .article-title { font-size: var(--fs-sm); font-weight: 750; color: #1f2b3d; line-height: 1.4; }
    .article-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .article-badges { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .article-detail { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
    .article-detail-label { font-size: 10px; font-weight: 800; color: var(--subtle); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .article-detail-text { font-size: var(--fs-sm); color: var(--ink); line-height: 1.7; white-space: pre-wrap; background: var(--panel-soft); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 12px; max-height: 260px; overflow-y: auto; }
    .report-box { font-family: 'SF Mono','Fira Code',monospace; font-size: 11px; background: #152033; color: #cbd5e1; border-radius: 11px; padding: 12px 14px; overflow-x: auto; margin-bottom: 12px; white-space: pre-wrap; }
    .chevron { transition: transform .2s; flex-shrink: 0; color: var(--subtle); }
    .chevron.open { transform: rotate(90deg); color: var(--primary); }

    /* ── Publicados: tarjetas tipo revista, no tabla administrativa ──── */
    .pub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-items: start; }
    .pub-card { background: #fff; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; box-shadow: 0 5px 16px rgba(15,23,42,.035); cursor: pointer; transition: .18s ease; display: flex; flex-direction: column; }
    .pub-card:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(15,23,42,.08); border-color: var(--line-strong); }
    /* Al expandir, la tarjeta ocupa toda la fila de la grilla -- una
       columna de 300px no alcanza para leer un articulo completo comodo. */
    .pub-card.is-expanded { grid-column: 1 / -1; cursor: default; }
    .pub-card-image { position: relative; aspect-ratio: 16/9; background: linear-gradient(135deg, var(--primary-light), #eef3f6); overflow: hidden; flex-shrink: 0; transition: aspect-ratio .2s ease; }
    .pub-card.is-expanded .pub-card-image { aspect-ratio: 21/7; }
    .pub-card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pub-card-image-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-size: 13px; font-weight: 750; color: var(--primary); opacity: .55; }
    .pub-card-risk { position: absolute; top: 10px; right: 10px; box-shadow: 0 2px 8px rgba(15,23,42,.14); }
    .pub-card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
    .pub-card.is-expanded .pub-card-body { max-width: 760px; margin: 0 auto; padding: 26px 20px 32px; width: 100%; }
    .pub-card-eyebrow { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--primary); margin-bottom: 8px; }
    .pub-card.is-expanded .pub-card-eyebrow { font-size: 12px; }
    .pub-card-title { font-size: 16px; font-weight: 800; line-height: 1.35; letter-spacing: -.01em; color: var(--ink); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .pub-card.is-expanded .pub-card-title { font-size: 26px; line-height: 1.25; -webkit-line-clamp: unset; margin-bottom: 12px; }
    .pub-card-summary { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .pub-card.is-expanded .pub-card-summary { font-size: 15.5px; line-height: 1.6; -webkit-line-clamp: unset; margin-bottom: 16px; }
    .pub-card-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--subtle); margin-top: auto; padding-top: 4px; }
    .pub-card-expanded { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
    .pub-card-expanded .article-detail-text { font-size: 14.5px; padding: 16px 18px; }
    .pub-card-content { font-size: 15px; color: var(--ink); line-height: 1.85; white-space: pre-wrap; margin-bottom: 18px; }
    .pub-card-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 12px; padding: 8px; border: none; background: var(--panel-soft); border-radius: 9px; color: var(--primary); font-size: 12px; font-weight: 750; cursor: pointer; }
    .pub-card-toggle:hover { background: var(--primary-light); }

    /* ── Paginacion (tabla y tarjetas de Publicados) ──────────────────── */
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 4px 4px; font-size: 12.5px; flex-wrap: wrap; }

    /* ── Paso a paso de una corrida EN_CURSO (que fuente se esta
       consultando en este momento) ───────────────────────────────────── */
    .run-steps { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
    .run-step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; color: var(--subtle); transition: color .15s; }
    .run-step-icon { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; }
    .run-step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .run-step-name { font-weight: 700; color: var(--ink); font-family: var(--font-mono, monospace); font-size: 11.5px; min-width: 90px; }
    .run-step-status { min-width: 84px; }
    .run-step-detail { font-size: 11.5px; }
    .run-step-en_curso { color: var(--primary); }
    .run-step-en_curso .run-step-name { color: var(--primary); }
    .run-step-completado .run-step-icon { color: var(--green); }
    .run-step-error { color: var(--red); }
    .run-step-error .run-step-icon { color: var(--red); }

    /* ── Toast (estilo "notice" del anexo: pastilla oscura inferior) ── */
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #172033; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 14px 34px rgba(15,23,42,.22); z-index: 9999; max-width: 320px; animation: toast-in .2s ease-out; }
    .toast.success { background: var(--primary); }
    .toast.error { background: var(--red); }

    .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .mt-4 { margin-top: 16px; } .mb-3 { margin-bottom: 12px; }
    .muted { color: var(--muted); }
    .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .text-mono { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    .spin.dark { border-color: rgba(15,107,91,.18); border-top-color: var(--primary); }
    .loader { padding: 32px; text-align: center; }

    .pipeline-banner { background: var(--primary-light); color: var(--primary); border: 1px solid var(--green-border); border-radius: 13px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); font-weight: 650; margin-bottom: 16px; }
    .pipeline-banner.done { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .pipeline-banner-detail { color: var(--muted); font-weight: 400; font-size: var(--fs-xs); }
    .inline-form { background: var(--panel-soft); border-top: 1px solid var(--line); padding: 16px 20px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .inline-form .field { margin-bottom: 0; flex: 1; min-width: 160px; }

    /* ── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 1180px) {
      .app { grid-template-columns: 1fr; padding: 14px; }
      .sidebar { position: relative; top: auto; min-height: auto; }
      .tabs { grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); grid-auto-flow: column; }
    }
    @media (max-width: 680px) {
      .main { padding: 16px; }
      .topbar { justify-content: flex-start; }
      .card-header { padding: 14px 16px; }
      .card-body { padding: 16px; }
      .inline-form { padding: 14px 16px; }
      .article-row { padding: 12px 16px; }
      .section-title { font-size: 20px; }
    }
    @media (max-width: 480px) {
      .article-row-head { flex-wrap: wrap; }
      .article-badges { justify-content: flex-start; flex-basis: 100%; flex-shrink: 1; width: 100%; }
    }
  </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <!-- ══════════════════════════════════════════════════════ LOGIN ══ -->
  <div x-show="!authenticated" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        Diario de la Salud
      </div>
      <p class="login-eyebrow">EcoFarma — Panel editorial</p>
      <p class="login-sub">Ingresa tus credenciales para acceder al panel</p>

      <div class="field">
        <label class="label">Correo</label>
        <input
          type="email"
          class="input"
          placeholder="nombre@ecofarma.co"
          x-model="loginEmail"
          @keydown.enter="$refs.loginPassword.focus()"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label class="label">Contraseña</label>
        <input
          type="password"
          class="input"
          placeholder="••••••••"
          x-model="loginPassword"
          x-ref="loginPassword"
          @keydown.enter="login()"
          autocomplete="current-password"
        />
      </div>

      <button class="btn btn-primary btn-full" @click="login()" :disabled="authLoading || !loginEmail.trim() || !loginPassword.trim()">
        <span x-show="authLoading" class="spin"></span>
        <span x-text="authLoading ? 'Verificando...' : 'Ingresar'"></span>
      </button>

      <div x-show="authError" class="error-msg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span x-text="authError"></span>
      </div>

      <p class="login-footer">
        Ingesta &rarr; reescritura IA &rarr; verificación &rarr; validación humana &rarr; publicación
      </p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════ DASHBOARD ══ -->
  <div x-show="authenticated" class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="header-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          EcoFarma
        </div>
        <p>Dashboard unificado de workflows</p>
        <span class="header-role" x-text="me?.role ?? ''"></span>
      </div>

      <div class="nav-title">Workflows</div>
      <nav class="tabs">
        <button class="tab" :class="{ active: tab === 'articulos' }" @click="tab = 'articulos'; loadSection('articulos'); loadAllArticles(); loadRuns()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Diario de la Salud
        </button>
      </nav>

      <div class="nav-title">Estado</div>
      <nav class="tabs">
        <button class="tab" :class="{ active: tab === 'articulos' && articleStateFilter === 'all' }" @click="setArticleFilter('all')">
          Todos
          <span x-show="articles.length" class="tab-badge tab-badge-count" x-text="articles.length"></span>
        </button>
        <button class="tab" :class="{ active: tab === 'articulos' && articleStateFilter === 'revision' }" @click="setArticleFilter('revision')">
          En revisión
          <span x-show="countByFilter('revision')" class="tab-badge tab-badge-count" x-text="countByFilter('revision')"></span>
        </button>
        <button class="tab" :class="{ active: tab === 'articulos' && articleStateFilter === 'triage' }" @click="setArticleFilter('triage')">
          Triage
          <span x-show="countByFilter('triage')" class="tab-badge" x-text="countByFilter('triage')"></span>
        </button>
        <button class="tab" :class="{ active: tab === 'articulos' && articleStateFilter === 'validado' }" @click="setArticleFilter('validado')">
          Validados
          <span x-show="countByFilter('validado')" class="tab-badge tab-badge-count" x-text="countByFilter('validado')"></span>
        </button>
        <button class="tab" :class="{ active: tab === 'articulos' && articleStateFilter === 'publicado' }" @click="setArticleFilter('publicado')">
          Publicados
          <span x-show="countByFilter('publicado')" class="tab-badge tab-badge-count" x-text="countByFilter('publicado')"></span>
        </button>
        <button class="tab" :class="{ active: tab === 'articulos' && articleStateFilter === 'rechazado' }" @click="setArticleFilter('rechazado')">
          Rechazados
          <span x-show="countByFilter('rechazado')" class="tab-badge tab-badge-count" x-text="countByFilter('rechazado')"></span>
        </button>
      </nav>

      <div class="nav-title">Panel</div>
      <nav class="tabs">
        <button class="tab" :class="{ active: tab === 'fuentes' }" @click="tab = 'fuentes'; loadSection('fuentes'); loadSources()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Fuentes
        </button>
        <button class="tab" :class="{ active: tab === 'guia' }" @click="tab = 'guia'; loadSection('guia'); loadSourceStats(); loadPrompts()" title="Guía de uso">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Guía
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="header-status">
          <span class="dot" :class="{ err: !health?.db }"></span>
          <span x-text="health?.db ? 'Conectado' : 'Sin BD'"></span>
        </div>
        <button
          class="btn-ghost"
          @click="triggerAllSources()"
          :disabled="triggerBusy"
          title="Ingiere de inmediato todas las fuentes activas, sin esperar su horario"
        >
          <span x-show="triggerBusy" class="spin dark"></span>
          <span x-text="triggerBusy ? 'Consultando...' : 'Consultar fuentes ahora'"></span>
        </button>
        <button class="btn-ghost" @click="logout()">Salir</button>
      </div>
    </aside>

    <main class="main">
      <div
        x-show="pipelineStatus.isActive || pipelineJustFinished"
        x-transition
        class="pipeline-banner"
        :class="{ done: !pipelineStatus.isActive && pipelineJustFinished }"
        style="display:none;"
      >
        <span x-show="pipelineStatus.isActive" class="spin dark"></span>
        <svg x-show="!pipelineStatus.isActive && pipelineJustFinished" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span class="pipeline-banner-text" x-text="pipelineStatus.isActive ? `Procesando pipeline -- ${pipelineStatus.totalPending} tarea(s) en curso o en cola` : 'Proceso del pipeline terminado'"></span>
        <span x-show="pipelineStatus.isActive && pipelineStageDetail()" class="pipeline-banner-detail" x-text="pipelineStageDetail()"></span>
      </div>

      <div x-show="tab === 'articulos'" id="section-articulos"></div>
      <div x-show="tab === 'fuentes'" id="section-fuentes"></div>
      <div x-show="tab === 'guia'" id="section-guia"></div>
    </main>
  </div>

  <div
    x-show="toast.show"
    x-transition.opacity
    class="toast"
    :class="toast.type"
    x-text="toast.msg"
    style="display:none;"
  ></div>

<script>
function app() {
  return {
    // Auth
    loginEmail: '',
    loginPassword: '',
    jwtToken: localStorage.getItem('ds_jwt') || '',
    authenticated: false,
    authLoading: false,
    authError: '',
    me: null,

    // Nav
    tab: 'articulos',
    _sectionsLoaded: {},

    // Health
    health: null,

    // Data
    // Vista unificada (2026-07-17, pedido explicito del usuario): un solo
    // arreglo con todos los estados relevantes para un humano (antes eran
    // 3 pestanas/arreglos separados: queue/triage/publishQueue). El filtro
    // de Estado del sidebar filtra sobre este mismo arreglo -- ver
    // filteredArticles().
    articles: [],
    articlesLoading: false,
    articleStateFilter: 'all',
    articlesPage: 1,
    articlesPageSize: 10,
    sources: [],
    sourcesLoading: false,
    sourceStats: [],
    sourceStatsLoading: false,
    promptTemplates: [],
    promptsLoading: false,
    pipelineStatus: { isActive: false, totalPending: 0, stages: [] },
    pipelineJustFinished: false,
    _pipelineInterval: null,
    _pipelineFinishedTimeout: null,
    triggerBusy: false,
    selectTopBusy: false,
    runs: [],
    runsLoading: false,
    runsPage: 1,
    runsPageSize: 5,
    scheduleAt: '',
    scheduleBusy: false,

    // UI
    toast: { show: false, msg: '', type: 'success' },

    async init() {
      if (this.jwtToken) {
        const ok = await this.tryConnect();
        if (!ok) { localStorage.removeItem('ds_jwt'); this.jwtToken = ''; }
      }
    },

    async loadSection(name) {
      if (this._sectionsLoaded[name]) return;
      this._sectionsLoaded[name] = true;
      const el = document.getElementById(`section-${name}`);
      if (!el) return;
      try {
        const res = await fetch(`/sections/${name}.html`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        el.innerHTML = await res.text();
      } catch (e) {
        this._sectionsLoaded[name] = false;
        el.innerHTML = `<div style="padding:32px;text-align:center;color:#dc2626;font-size:13px;">Error al cargar esta sección. Recarga la página.</div>`;
      }
    },

    // ── Auth ─────────────────────────────────────────────────────────────
    async login() {
      this.authError = '';
      if (!this.loginEmail.trim() || !this.loginPassword.trim()) return;
      this.authLoading = true;
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.loginEmail.trim(), password: this.loginPassword }),
        });
        const body = await r.json();
        if (!r.ok) { this.authError = body?.message || 'Credenciales inválidas'; return; }
        this.jwtToken = body.accessToken;
        const ok = await this.tryConnect();
        if (!ok) { this.authError = 'No se pudo conectar al servidor'; this.jwtToken = ''; }
      } catch {
        this.authError = 'Error al conectar con el servidor';
      } finally { this.authLoading = false; }
    },

    async tryConnect() {
      try {
        const meRes = await fetch('/auth/me', { headers: this.headers() });
        if (!meRes.ok) return false;
        this.me = await meRes.json();
        localStorage.setItem('ds_jwt', this.jwtToken);
        this.authenticated = true;
        await this.loadSection('articulos');
        await Promise.all([this.loadHealth(), this.loadAllArticles(), this.loadRuns()]);
        this.startPipelinePolling();
        return true;
      } catch { return false; }
    },

    logout() {
      localStorage.removeItem('ds_jwt');
      this.jwtToken = ''; this.loginEmail = ''; this.loginPassword = ''; this.authenticated = false;
      this.me = null; this.articles = []; this.sources = []; this.health = null; this.runs = [];
      clearInterval(this._pipelineInterval);
      this._pipelineInterval = null;
      this.pipelineStatus = { isActive: false, totalPending: 0, stages: [] };
      this.pipelineJustFinished = false;
    },

    // ── Indicador visual de proceso en curso / terminado ────────────────────
    // Consulta GET /pipeline/status (conteos reales de BullMQ, no un
    // estimado) para mostrar que el pipeline esta trabajando sin importar
    // que boton lo disparo (Correr ahora, Seleccionar mejores ahora, un
    // reintento automatico, Regenerar) y avisar claramente cuando termina.
    startPipelinePolling() {
      clearInterval(this._pipelineInterval);
      this.pollPipelineStatus();
      this._pipelineInterval = setInterval(() => this.pollPipelineStatus(), 3000);
    },

    async pollPipelineStatus() {
      try {
        const r = await this.get('/pipeline/status');
        if (!r.ok) return;
        const data = await r.json();
        const wasActive = this.pipelineStatus.isActive;
        this.pipelineStatus = data;
        if (wasActive && !data.isActive) {
          this.pipelineJustFinished = true;
          this.showToast('Proceso del pipeline terminado', 'success');
          this.refreshVisibleTab();
          clearTimeout(this._pipelineFinishedTimeout);
          this._pipelineFinishedTimeout = setTimeout(() => { this.pipelineJustFinished = false; }, 6000);
        } else if (data.isActive && this.tab === 'articulos') {
          // Pedido explicito del usuario 2026-07-17: ver que fuente se
          // esta consultando en este momento, paso a paso -- mismo
          // cadencia de 3s que ya usa este poll, sin loop nuevo.
          this.loadRuns({ silent: true });
        }
      } catch { /* silencioso -- es solo un indicador visual, no bloquea nada */ }
    },

    pipelineStageDetail() {
      return (this.pipelineStatus.stages || [])
        .filter((s) => s.waiting + s.active + s.delayed > 0)
        .map((s) => `${s.label}: ${s.waiting + s.active + s.delayed}`)
        .join(' · ');
    },

    // Recarga la pestana visible para que el resultado del proceso
    // aparezca solo, sin que el usuario tenga que darle "Actualizar".
    refreshVisibleTab() {
      if (this.tab === 'articulos') { this.loadAllArticles(); this.loadRuns(); }
      else if (this.tab === 'fuentes') { this.loadSources(); }
      else if (this.tab === 'guia') { this.loadSourceStats(); }
    },

    async loadHealth() {
      try { const r = await fetch('/health'); if (r.ok) this.health = await r.json(); } catch {}
    },

    // ── Artículos (vista unificada: revisión + triage + validado + rechazado + publicado) ──
    async loadAllArticles() {
      this.articlesLoading = true;
      try {
        const r = await this.get('/validation/all');
        if (r.ok) {
          this.articles = (await r.json()).map(a => ({
            ...a, _open: false, _busy: false,
            _editedTitle: a.rewrittenTitle, _editedSummary: a.rewrittenSummary, _editedContent: a.rewrittenContent,
          }));
          this.articlesPage = 1;
        }
      } finally { this.articlesLoading = false; }
    },

    // Filtro de Estado del sidebar -- sobre el mismo arreglo, sin volver
    // a pedirle nada al backend (mismo patron que los filtros del anexo).
    filteredArticles() {
      const triageStates = ['GROUNDING_FALLIDO', 'CUMPLIMIENTO_FALLIDO', 'ERROR'];
      switch (this.articleStateFilter) {
        case 'revision':  return this.articles.filter(a => a.state === 'EN_VALIDACION');
        case 'triage':    return this.articles.filter(a => triageStates.includes(a.state));
        case 'validado':  return this.articles.filter(a => a.state === 'VALIDADO');
        case 'publicado': return this.articles.filter(a => a.state === 'PUBLICADO');
        case 'rechazado': return this.articles.filter(a => a.state === 'RECHAZADO');
        default:          return this.articles;
      }
    },

    setArticleFilter(filter) {
      this.tab = 'articulos';
      this.loadSection('articulos');
      this.articleStateFilter = filter;
      this.articlesPage = 1;
    },

    // Paginacion (2026-07-17, pedido explicito del usuario): no mas de
    // articlesPageSize (10) filas a la vez, tanto en la tabla como en las
    // tarjetas de Publicados -- ambas vistas leen del mismo
    // filteredArticles(), asi que una sola paginacion sirve para las dos.
    totalPages() {
      return Math.max(1, Math.ceil(this.filteredArticles().length / this.articlesPageSize));
    },
    paginatedArticles() {
      const start = (this.articlesPage - 1) * this.articlesPageSize;
      return this.filteredArticles().slice(start, start + this.articlesPageSize);
    },
    goToPage(n) {
      this.articlesPage = Math.min(Math.max(1, n), this.totalPages());
    },

    countByFilter(filter) {
      const prev = this.articleStateFilter;
      this.articleStateFilter = filter;
      const n = this.filteredArticles().length;
      this.articleStateFilter = prev;
      return n;
    },

    articleFilterLabel(filter) {
      return {
        all: 'Todos', revision: 'En revisión', triage: 'Triage',
        validado: 'Validados', publicado: 'Publicados', rechazado: 'Rechazados',
      }[filter] || filter;
    },

    articleStateLabel(state) {
      return {
        EN_VALIDACION: 'En revisión', GROUNDING_FALLIDO: 'Triage: fidelidad',
        CUMPLIMIENTO_FALLIDO: 'Triage: cumplimiento', ERROR: 'Triage: error técnico',
        VALIDADO: 'Validado', RECHAZADO: 'Rechazado', PUBLICADO: 'Publicado',
      }[state] || state;
    },

    async validateArticle(a, decision) {
      a._busy = true;
      try {
        const payload = { decision };
        if (decision === 'RECHAZADO') {
          payload.notes = prompt('Motivo del rechazo (opcional):') || undefined;
        } else if (decision === 'EDITADO_Y_VALIDADO') {
          payload.editedTitle = a._editedTitle;
          payload.editedSummary = a._editedSummary;
          payload.editedContent = a._editedContent;
        }
        const r = await this.post(`/validation/${a.id}/validate`, payload);
        if (r.ok) {
          const updated = await r.json();
          Object.assign(a, updated, { _open: false, _busy: false });
          this.showToast(decision === 'RECHAZADO' ? 'Artículo rechazado' : 'Artículo validado');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.detail || b?.message || 'Error al validar', 'error');
        }
      } finally { a._busy = false; }
    },

    async regenerate(a) {
      a._busy = true;
      try {
        const r = await this.post(`/validation/${a.id}/regenerate`, {});
        if (r.ok) {
          // Vuelve a REESCRITO (fuera de esta vista) hasta que el pipeline
          // la resuelva de nuevo -- se quita de la lista local, no hace
          // falta pedir todo el arreglo otra vez.
          this.articles = this.articles.filter(x => x.id !== a.id);
          this.showToast('Reescritura reencolada');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.detail || b?.message || 'No se pudo regenerar', 'error');
        }
      } finally { a._busy = false; }
    },

    async publishArticle(a) {
      a._busy = true;
      try {
        const r = await this.post(`/publish/${a.id}/publish`, {});
        if (r.ok) {
          const updated = await r.json();
          Object.assign(a, updated, { _open: false, _busy: false });
          this.showToast('Artículo publicado');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.detail || b?.message || 'Error al publicar', 'error');
        }
      } finally { a._busy = false; }
    },

    // ── Fuentes ──────────────────────────────────────────────────────────
    async loadSources() {
      this.sourcesLoading = true;
      try {
        const r = await this.get('/sources');
        if (r.ok) this.sources = (await r.json()).map(s => ({
          ...s,
          _scheduledTimeInput: s.scheduledTime || '',
          _scheduleBusy: false,
          _maxItemsPerRunInput: s.maxItemsPerRun || null,
          _maxItemsBusy: false,
          _maxAgeDaysInput: s.maxAgeDays || null,
          _maxAgeBusy: false,
        }));
      } finally { this.sourcesLoading = false; }
    },

    async loadSourceStats() {
      this.sourceStatsLoading = true;
      try {
        const r = await this.get('/sources/stats');
        if (r.ok) this.sourceStats = await r.json();
      } finally { this.sourceStatsLoading = false; }
    },

    // ── Prompts y reglas de IA (editable desde el panel, nada hardcodeado) ──
    async loadPrompts() {
      this.promptsLoading = true;
      try {
        const r = await this.get('/prompts');
        if (r.ok) {
          const data = await r.json();
          this.promptTemplates = data.map((p) => ({ ...p, _open: false, _busy: false, _editedContent: p.content }));
        }
      } finally { this.promptsLoading = false; }
    },

    promptLabel(key) {
      return {
        SCORING: 'Clasificación (relevancia y riesgo)',
        REWRITE: 'Reescritura',
        VERIFY_CLAIMS: 'Verificación de fidelidad',
        COMPLIANCE: 'Cumplimiento normativo',
        EXTRACT_CLAIMS: 'Extracción de afirmaciones (auditoría)',
      }[key] || key;
    },

    async savePrompt(p) {
      p._busy = true;
      try {
        const r = await this.patch(`/prompts/${p.key}`, { content: p._editedContent });
        if (r.ok) {
          const updated = await r.json();
          p.content = updated.content;
          p._editedContent = updated.content;
          p.updatedAt = updated.updatedAt;
          this.showToast(`Prompt "${this.promptLabel(p.key)}" actualizado`);
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar el prompt', 'error');
        }
      } finally { p._busy = false; }
    },

    async toggleSource(s) {
      const r = await this.patch(`/sources/${s.id}/active`, { isActive: !s.isActive });
      if (r.ok) { s.isActive = !s.isActive; this.showToast(s.isActive ? 'Fuente activada' : 'Fuente desactivada'); }
      else this.showToast('No tienes permiso para esta acción', 'error');
    },

    async saveSchedule(s) {
      s._scheduleBusy = true;
      try {
        const value = (s._scheduledTimeInput || '').trim();
        const r = await this.patch(`/sources/${s.id}`, { scheduledTime: value === '' ? null : value });
        if (r.ok) {
          const updated = await r.json();
          s.scheduledTime = updated.scheduledTime;
          s.nextRunAt = updated.nextRunAt;
          this.showToast(s.scheduledTime ? `Horario diario fijado a las ${s.scheduledTime}` : 'Horario diario desactivado (queda solo manual)');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar el horario', 'error');
        }
      } finally { s._scheduleBusy = false; }
    },

    async saveMaxItemsPerRun(s) {
      s._maxItemsBusy = true;
      try {
        const value = s._maxItemsPerRunInput || null;
        const r = await this.patch(`/sources/${s.id}`, { maxItemsPerRun: value });
        if (r.ok) {
          const updated = await r.json();
          s.maxItemsPerRun = updated.maxItemsPerRun;
          s._maxItemsPerRunInput = updated.maxItemsPerRun || null;
          this.showToast(s.maxItemsPerRun ? `Tope fijado a ${s.maxItemsPerRun} artículo(s) por corrida` : 'Tope quitado (usa el default del adapter)');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar el tope', 'error');
        }
      } finally { s._maxItemsBusy = false; }
    },

    async saveMaxAgeDays(s) {
      s._maxAgeBusy = true;
      try {
        const value = s._maxAgeDaysInput || null;
        const r = await this.patch(`/sources/${s.id}`, { maxAgeDays: value });
        if (r.ok) {
          const updated = await r.json();
          s.maxAgeDays = updated.maxAgeDays;
          s._maxAgeDaysInput = updated.maxAgeDays || null;
          this.showToast(s.maxAgeDays ? `Ventana de recencia fijada a ${s.maxAgeDays} día(s)` : 'Ventana quitada (usa el default del adapter)');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar la ventana de recencia', 'error');
        }
      } finally { s._maxAgeBusy = false; }
    },

    // "Buscar otras 3" por fuente (2026-07-17): sube el tope de esa fuente
    // +3 y dispara SOLO su ingesta -- para cuando en la revision humana
    // ninguna de las candidatas actuales sirvio.
    async fetchMoreForSource(s) {
      s._fetchMoreBusy = true;
      try {
        const r = await this.post(`/ingestion/fetch-more/${s.id}`, {});
        if (r.ok) {
          const b = await r.json();
          s.maxItemsPerRun = b.newLimit;
          this.showToast(`${b.sourceCode}: buscando hasta ${b.newLimit} candidatos (antes ${b.newLimit - 3})`);
        } else {
          const body = await r.json().catch(() => ({}));
          this.showToast(body?.message || 'No se pudo buscar mas candidatos', 'error');
        }
      } finally { s._fetchMoreBusy = false; }
    },

    // ── Disparo manual de ingesta ────────────────────────────────────────
    async triggerAllSources() {
      this.triggerBusy = true;
      try {
        const r = await this.post('/ingestion/trigger-all', {});
        if (r.ok) {
          const b = await r.json();
          this.showToast(b.triggered > 0 ? `Consultando ${b.triggered} fuente(s): ${b.sources.join(', ')}` : 'No hay fuentes activas para consultar');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo disparar la ingesta', 'error');
        }
      } finally { this.triggerBusy = false; }
    },

    async selectTopNow() {
      this.selectTopBusy = true;
      try {
        const r = await this.post('/rewrite/select-top', {});
        if (r.ok) {
          const b = await r.json();
          this.showToast(b.selected > 0 ? `${b.selected} artículo(s) enviado(s) a reescritura (de hasta ${b.limit})` : 'Ningún EVALUADO alcanzó el piso de calidad hoy -- no se seleccionó nada');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo seleccionar', 'error');
        }
      } finally { this.selectTopBusy = false; }
    },

    // ── Corridas de ingesta (historial + calendario) ────────────────────
    // silent=true: refresco de fondo durante el polling del pipeline (cada
    // 3s mientras hay una corrida EN_CURSO) -- no debe prender el loader
    // ni parpadear la tarjeta, solo actualizar los datos por debajo.
    async loadRuns(opts = {}) {
      if (!opts.silent) this.runsLoading = true;
      try {
        const r = await this.get('/ingestion/runs');
        if (r.ok) this.runs = (await r.json()).map(run => ({ ...run, _busy: false }));
      } finally { if (!opts.silent) this.runsLoading = false; }
    },

    // Paginacion de "Corridas de ingesta" (2026-07-17, pedido explicito del
    // usuario: no mas de 5 a la vez) -- runsPage NO se resetea en cada
    // refresco silencioso del polling (perderia la pagina si el usuario
    // esta viendo la 2 mientras el pipeline sigue corriendo), solo se
    // acota para que nunca quede fuera de rango si la lista se achica.
    runsTotalPages() {
      return Math.max(1, Math.ceil(this.runs.length / this.runsPageSize));
    },
    paginatedRuns() {
      if (this.runsPage > this.runsTotalPages()) this.runsPage = this.runsTotalPages();
      const start = (this.runsPage - 1) * this.runsPageSize;
      return this.runs.slice(start, start + this.runsPageSize);
    },
    goToRunsPage(n) {
      this.runsPage = Math.min(Math.max(1, n), this.runsTotalPages());
    },

    async scheduleRun() {
      if (!this.scheduleAt) return;
      this.scheduleBusy = true;
      try {
        const runAt = new Date(this.scheduleAt).toISOString();
        const r = await this.post('/ingestion/schedule', { runAt });
        if (r.ok) {
          this.scheduleAt = '';
          this.showToast('Corrida programada');
          await this.loadRuns();
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo programar la corrida', 'error');
        }
      } finally { this.scheduleBusy = false; }
    },

    async cancelRun(run) {
      run._busy = true;
      try {
        const r = await this.delete(`/ingestion/schedule/${run.id}`);
        if (r.ok) {
          this.showToast('Corrida programada cancelada');
          await this.loadRuns();
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo cancelar la corrida', 'error');
        }
      } finally { run._busy = false; }
    },

    runStatusBadge(status) {
      return { PROGRAMADO: 'badge-blue', EN_CURSO: 'badge-amber', COMPLETADO: 'badge-green', CANCELADO: 'badge-gray' }[status] || 'badge-gray';
    },
    runStatusLabel(status) {
      return { PROGRAMADO: 'Programado', EN_CURSO: 'En curso', COMPLETADO: 'Completado', CANCELADO: 'Cancelado' }[status] || status;
    },

    // ── Progreso por fuente dentro de una corrida (2026-07-17, pedido
    // explicito del usuario: "que fuente se esta consultando en ese
    // momento, paso a paso") ──────────────────────────────────────────
    runSourceLabel(status) {
      return { PENDIENTE: 'Pendiente', EN_CURSO: 'Consultando…', COMPLETADO: 'Listo', ERROR: 'Falló' }[status] || status;
    },
    runSourceDetail(rs) {
      if (rs.status === 'COMPLETADO') {
        const created = rs.itemsCreated ?? 0;
        const dup = rs.itemsDuplicate ?? 0;
        return `${created} nuevo${created !== 1 ? 's' : ''}${dup ? `, ${dup} repetido${dup !== 1 ? 's' : ''}` : ''}`;
      }
      if (rs.status === 'ERROR') return rs.errorMessage || 'Error sin detalle';
      return '';
    },
    formatDateTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('es-CO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    },
    // Fecha/hora separadas para columnas de tabla angostas (2026-07-17,
    // pedido explicito del usuario: el string largo de formatDateTime se
    // veia amontonado envolviendo en varias lineas dentro de una celda
    // angosta) -- dos lineas cortas y prolijas en vez de una sola que
    // se corta a la mitad.
    formatDateOnly(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
    },
    formatTimeOnly(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    },

    // ── HTTP helpers ─────────────────────────────────────────────────────
    headers() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.jwtToken}` }; },
    async _fetch(url, opts) {
      const res = await fetch(url, opts);
      if (res.status === 401 && this.authenticated) {
        this.logout();
        this.showToast('Sesión expirada — vuelve a iniciar sesión', 'error');
      }
      return res;
    },
    get(url)        { return this._fetch(url, { headers: this.headers() }); },
    post(url, body) { return this._fetch(url, { method: 'POST',  headers: this.headers(), body: JSON.stringify(body) }); },
    patch(url, body){ return this._fetch(url, { method: 'PATCH', headers: this.headers(), body: JSON.stringify(body) }); },
    delete(url)     { return this._fetch(url, { method: 'DELETE', headers: this.headers() }); },

    // ── Utils ────────────────────────────────────────────────────────────
    showToast(msg, type = 'success') {
      this.toast = { show: true, msg, type };
      setTimeout(() => { this.toast.show = false; }, 3000);
    },

    timeAgo(iso) {
      if (!iso) return '—';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1)  return 'Ahora mismo';
      if (mins < 60) return `hace ${mins} min`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24)  return `hace ${hrs}h`;
      const days = Math.floor(hrs / 24);
      return `hace ${days} día${days !== 1 ? 's' : ''}`;
    },

    riskBadge(level) {
      return { BAJO: 'badge-green', MEDIO: 'badge-amber', ALTO: 'badge-red' }[level] || 'badge-gray';
    },
    checkBadge(status) {
      return { APROBADO: 'badge-green', RECHAZADO: 'badge-red', PENDIENTE: 'badge-gray' }[status] || 'badge-gray';
    },
    stateBadge(state) {
      const map = {
        RECOLECTADO: 'badge-gray', DESCARTADO: 'badge-gray', EVALUADO: 'badge-blue', REESCRITO: 'badge-blue',
        GROUNDING_FALLIDO: 'badge-red', CUMPLIMIENTO_FALLIDO: 'badge-red', BORRADOR: 'badge-amber',
        EN_VALIDACION: 'badge-amber', VALIDADO: 'badge-green', RECHAZADO: 'badge-red',
        PUBLICADO: 'badge-green', ERROR: 'badge-red',
      };
      return map[state] || 'badge-gray';
    },
  };
}
</script>
