<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diario de la Salud — EcoFarma</title>
  <script defer src="/alpine.min.js"></script>
  <style>
    /* ══════════════════════════════════════════════════════════════════
       2026-07-17: restyle puramente visual sobre el estilo de
       annexe-html-03-dashboard-diario-salud-v3-modern.html -- mismos
       nombres de clase que ya usan index.html y sections/*.html, solo
       cambian los valores de diseno (colores, radios, sombras,
       tipografia) y la estructura del shell (sidebar en vez de tabs
       horizontales). Ninguna funcionalidad, binding de Alpine o llamada
       a la API cambio. (sections/ tenia 5 archivos al momento de este
       restyle -- cola/triage/publicar se fusionaron despues en
       articulos.html, ver su comentario de cabecera.)
       ══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f4f7fb;
      --panel:#ffffff;
      --panel-soft:#f8fafc;
      --ink:#152033;
      --muted:#64748b;
      --subtle:#94a3b8;
      --line:#e4eaf1;
      --line-strong:#d7dee8;

      --primary:#0f6b5b;
      --primary-dark:#0a5549;
      --primary-light:#e9f6f2;

      --green:#17643b;      --green-bg:#ebf8f0;      --green-border:#ccebd8;
      --amber:#a65b12;      --amber-bg:#fff6e8;      --amber-border:#f3dfbd;
      --red:#b42318;        --red-bg:#fff0ef;        --red-border:#f2d1ce;
      --blue:#245f91;       --blue-bg:#edf5fb;
      --orange:#a65b12;     --orange-bg:#fff6e8;

      --fs-xs:  11px;
      --fs-sm:  13px;
      --fs-md:  15px;
      --fs-lg:  22px;
      --radius:    12px;
      --radius-lg: 18px;
      --shadow:    0 1px 2px rgba(15,23,42,.04);
      --shadow-md: 0 12px 30px rgba(15,23,42,.09);
    }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(36,95,145,.06), transparent 32%),
        var(--bg);
      color: var(--ink); font-size: var(--fs-sm); line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    [x-cloak] { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-dot {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(15,107,91,.35); }
      60%      { opacity:.8; box-shadow: 0 0 0 5px rgba(15,107,91,0); }
    }
    @keyframes toast-in { from { transform: translate(-50%,8px); opacity:0; } to { transform: translate(-50%,0); opacity:1; } }

    /* ── Shell: sidebar + main (reemplaza header/tabs horizontales) ──── */
    .app { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 18px; align-items: start; max-width: 1480px; margin: 0 auto; padding: 22px; }

    .sidebar {
      position: sticky; top: 22px; min-height: calc(100vh - 44px);
      background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); padding: 18px 14px; display: flex; flex-direction: column;
    }
    .brand { padding: 8px 10px 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .brand .header-logo { display: flex; align-items: center; background: #12238f; border-radius: 9px; padding: 8px 14px; }
    .brand .header-logo img { height: 26px; width: auto; display: block; }
    .brand p { margin: 7px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
    .header-role { display: inline-block; margin-top: 6px; color: var(--subtle); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }

    /* Cada area del sidebar (Workflows+Estado, Blog, Inventario, Panel) va
       en su propio .nav-group -- separador solido entre grupos para que
       se distingan de un vistazo, en vez del listado corrido de antes. */
    .nav-group { margin-bottom: 20px; }
    .nav-group + .nav-group { padding-top: 16px; border-top: 1px solid var(--line); }
    .nav-title { margin: 4px 10px 9px; color: var(--subtle); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
    /* "Estado" no es un area nueva, son filtros de "Diario de la Salud" --
       va anidado con su propio riel para que se lea como sub-nivel. */
    .nav-subtitle { margin: 16px 10px 8px; color: var(--subtle); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
    .tabs { display: grid; gap: 6px; }
    .tabs-nested { margin-left: 11px; padding-left: 11px; border-left: 2px solid var(--line); gap: 3px; }
    .tab-sub { font-size: 12.5px; padding: 7px 10px; font-weight: 600; }
    .tab {
      width: 100%; text-align: left; color: #334155; border: 1px solid transparent; border-radius: 11px;
      padding: 10px 12px; font-size: 13.5px; font-weight: 650; background: transparent; cursor: pointer;
      transition: .18s ease; display: flex; align-items: center; gap: 8px;
    }
    .tab svg { opacity: .6; flex-shrink: 0; transition: opacity .15s; }
    .tab:hover { background: var(--panel-soft); color: var(--ink); }
    .tab:hover svg { opacity: .85; }
    .tab.active { border-color: #cfe8e1; background: var(--primary-light); color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); font-weight: 700; }
    .tab.active svg { opacity: 1; }
    .tab-badge { display: inline-flex; align-items: center; justify-content: center; margin-left: auto; background: var(--red); color: #fff; font-size: 9.5px; font-weight: 800; border-radius: 999px; min-width: 16px; height: 16px; padding: 0 4px; }
    .tab.active .tab-badge { background: rgba(15,107,91,.16); color: var(--primary); }
    .tab-badge-count { background: var(--line); color: var(--muted); }
    .tab.active .tab-badge-count { background: rgba(15,107,91,.14); color: var(--primary); }
    .tabs-spacer { display: none; }

    .sidebar-foot { margin-top: auto; padding-top: 18px; }
    .header-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); padding: 9px 10px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
    .dot:not(.err) { animation: pulse-dot 2.8s ease-in-out infinite; }
    .dot.err { background: var(--red); animation: none; }
    .btn-ghost {
      width: 100%; background: var(--panel-soft); border: 1px solid var(--line); color: #475569;
      padding: 9px 12px; border-radius: 11px; cursor: pointer; font-size: 12.5px; font-weight: 700;
      transition: .16s ease; margin-top: 6px; text-align: left;
    }
    .btn-ghost:hover { background: #fff; border-color: var(--line-strong); }

    .main { min-width: 0; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 22px; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }

    .guide-section { margin-bottom: 28px; }
    .guide-section:last-child { margin-bottom: 0; }
    .guide-h2 { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .guide-h2 svg { flex-shrink: 0; color: var(--primary); }
    .guide-p { font-size: var(--fs-sm); color: var(--muted); line-height: 1.7; margin-bottom: 8px; }
    .guide-steps { list-style: none; counter-reset: step; }
    .guide-steps li { counter-increment: step; position: relative; padding-left: 34px; margin-bottom: 10px; font-size: var(--fs-sm); color: var(--ink); }
    .guide-steps li::before { content: counter(step); position: absolute; left: 0; top: 1px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; }
    .guide-tip { background: var(--blue-bg); border: 1px solid #cfe0ef; border-radius: 13px; padding: 10px 14px; font-size: 12px; color: var(--blue); display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
    .guide-tip svg { flex-shrink: 0; margin-top: 1px; }
    .guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
    .guide-card { background: var(--panel-soft); border: 1px solid var(--line); border-radius: 13px; padding: 14px; }
    .guide-card-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: #fff; margin-bottom: 8px; }
    .guide-card-title { font-size: var(--fs-xs); font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .guide-card-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }

    /* ── Login ─────────────────────────────────────────────────────── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top right, rgba(36,95,145,.08), transparent 32%), var(--bg);
    }
    .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-md); }
    .login-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: var(--fs-lg); letter-spacing: -.03em; margin-bottom: 8px; }
    .login-logo svg { width: 22px; height: 22px; color: var(--primary); }
    .login-eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); margin-bottom: 20px; }
    .login-sub { font-size: var(--fs-sm); color: var(--muted); margin-top: -14px; margin-bottom: 28px; }
    .login-help { font-size: var(--fs-xs); color: var(--subtle); margin-top: 20px; text-align: center; }
    .login-footer { font-size: 10px; color: var(--subtle); margin-top: 28px; text-align: center; border-top: 1px solid var(--line); padding-top: 16px; }

    .field { margin-bottom: 16px; }
    .label { display: block; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .input {
      width: 100%; padding: 10px 13px; border: 1px solid var(--line-strong); border-radius: 11px;
      font-size: 13.5px; background: #fff; color: var(--ink); outline: none; font-family: inherit;
      box-shadow: inset 0 1px 2px rgba(15,23,42,.02); transition: .18s ease;
    }
    .input::placeholder { color: var(--subtle); }
    .input:focus { border-color: #9ccdc1; box-shadow: 0 0 0 4px rgba(15,107,91,.08); }
    .textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 38px; padding: 9px 15px; border: 1px solid var(--line-strong); background: #fff;
      color: #334155; border-radius: 10px; font-size: 13px; font-weight: 750; cursor: pointer;
      box-shadow: 0 1px 2px rgba(15,23,42,.03); transition: .16s ease; font-family: inherit;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #c8d2de; box-shadow: 0 6px 14px rgba(15,23,42,.06); }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 8px 18px rgba(15,107,91,.16); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-secondary { background: var(--primary-light); border-color: #cfe8e1; color: var(--primary); }
    .btn-secondary:hover:not(:disabled) { background: #dcf1ea; }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .btn-danger:hover:not(:disabled) { background: #ffe3e0; }
    .btn-amber { background: var(--amber); border-color: var(--amber); color: #fff; }
    .btn-amber:hover:not(:disabled) { background: #8a4c0e; border-color: #8a4c0e; }
    .btn-sm { min-height: 32px; padding: 6px 11px; font-size: var(--fs-xs); }
    .btn-full { width: 100%; }
    .error-msg { display: flex; align-items: center; gap: 8px; background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); border-radius: 11px; padding: 10px 12px; font-size: var(--fs-xs); margin-top: 12px; }

    /* ── Tarjetas / secciones ──────────────────────────────────────── */
    .card { background: #fff; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; box-shadow: 0 5px 16px rgba(15,23,42,.035); }
    .card + .card { margin-top: 14px; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--panel-soft); }
    .card-title { font-size: var(--fs-sm); font-weight: 750; color: var(--ink); }
    .card-body { padding: 20px; }
    .section-title { font-size: 27px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.03em; color: var(--ink); }
    .section-sub { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 20px; max-width: 760px; }

    /* ── Tablas ────────────────────────────────────────────────────── */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 13px; }
    .table-scroll .table { min-width: 560px; }
    .table-wide .table { min-width: 1500px; }
    .table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .table th { text-align: left; font-size: 10.5px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: .075em; padding: 12px 14px; background: #f7f9fc; border-bottom: 1px solid var(--line); }
    .table td { padding: 12px 14px; border-bottom: 1px solid #edf1f5; font-size: 13px; vertical-align: middle; color: #334155; background: #fff; }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: #f8fbfa; }

    /* ── Badges / etiquetas (mismo nombre, look tipo "tag" del anexo) ─ */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; border: 1px solid transparent; }
    .badge-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
    .badge-red    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
    .badge-amber  { background: var(--amber-bg);  color: var(--amber);  border-color: var(--amber-border); }
    .badge-blue   { background: var(--blue-bg);   color: var(--blue);   border-color: #d7e6f3; }
    .badge-gray   { background: #f1f4f7;          color: #556274;       border-color: #e0e6ed; }
    .badge-orange { background: var(--orange-bg); color: var(--orange); border-color: var(--amber-border); }

    .empty { padding: 48px 20px; text-align: center; color: var(--subtle); }
    .empty svg { width: 40px; height: 40px; margin: 0 auto 14px; opacity: .25; }
    .empty p { font-size: var(--fs-sm); line-height: 1.6; }

    /* ── Filas de articulo (cards expandibles, mismo patron de hover
       que las filas de tabla del anexo) ──────────────────────────── */
    .article-row { padding: 15px 20px; border-bottom: 1px solid #edf1f5; cursor: pointer; transition: background .12s; }
    .article-row:last-child { border-bottom: none; }
    .article-row:hover { background: #f8fbfa; }
    .article-row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .article-title { font-size: var(--fs-sm); font-weight: 750; color: #1f2b3d; line-height: 1.4; }
    .article-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .article-badges { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .article-detail { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
    .article-detail-label { font-size: 10px; font-weight: 800; color: var(--subtle); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .article-detail-text { font-size: var(--fs-sm); color: var(--ink); line-height: 1.7; white-space: pre-wrap; background: var(--panel-soft); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 12px; max-height: 260px; overflow-y: auto; }
    .report-box { font-family: 'SF Mono','Fira Code',monospace; font-size: 11px; background: #152033; color: #cbd5e1; border-radius: 11px; padding: 12px 14px; overflow-x: auto; margin-bottom: 12px; white-space: pre-wrap; }
    .chevron { transition: transform .2s; flex-shrink: 0; color: var(--subtle); }
    .chevron.open { transform: rotate(90deg); color: var(--primary); }

    /* ── Publicados: tarjetas tipo revista, no tabla administrativa ──── */
    .pub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-items: start; }
    .pub-card { background: #fff; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; box-shadow: 0 5px 16px rgba(15,23,42,.035); cursor: pointer; transition: .18s ease; display: flex; flex-direction: column; }
    .pub-card:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(15,23,42,.08); border-color: var(--line-strong); }
    /* Al expandir, la tarjeta ocupa toda la fila de la grilla -- una
       columna de 300px no alcanza para leer un articulo completo comodo. */
    .pub-card.is-expanded { grid-column: 1 / -1; cursor: default; }
    .pub-card-image { position: relative; aspect-ratio: 16/9; background: linear-gradient(135deg, var(--primary-light), #eef3f6); overflow: hidden; flex-shrink: 0; transition: aspect-ratio .2s ease; }
    .pub-card.is-expanded .pub-card-image { aspect-ratio: 21/7; }
    .pub-card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pub-card-image-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-size: 13px; font-weight: 750; color: var(--primary); opacity: .55; }
    .pub-card-risk { position: absolute; top: 10px; right: 10px; box-shadow: 0 2px 8px rgba(15,23,42,.14); }
    .pub-card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
    .pub-card.is-expanded .pub-card-body { max-width: 760px; margin: 0 auto; padding: 26px 20px 32px; width: 100%; }
    .pub-card-eyebrow { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--primary); margin-bottom: 8px; }
    .pub-card.is-expanded .pub-card-eyebrow { font-size: 12px; }
    .pub-card-title { font-size: 16px; font-weight: 800; line-height: 1.35; letter-spacing: -.01em; color: var(--ink); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .pub-card.is-expanded .pub-card-title { font-size: 26px; line-height: 1.25; -webkit-line-clamp: unset; margin-bottom: 12px; }
    .pub-card-summary { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .pub-card.is-expanded .pub-card-summary { font-size: 15.5px; line-height: 1.6; -webkit-line-clamp: unset; margin-bottom: 16px; }
    .pub-card-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--subtle); margin-top: auto; padding-top: 4px; }
    .pub-card-expanded { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
    .pub-card-expanded .article-detail-text { font-size: 14.5px; padding: 16px 18px; }
    .pub-card-content { font-size: 15px; color: var(--ink); line-height: 1.85; white-space: pre-wrap; margin-bottom: 18px; }
    .pub-card-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 12px; padding: 8px; border: none; background: var(--panel-soft); border-radius: 9px; color: var(--primary); font-size: 12px; font-weight: 750; cursor: pointer; }
    .pub-card-toggle:hover { background: var(--primary-light); }

    /* ── Paginacion (tabla y tarjetas de Publicados) ──────────────────── */
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 4px 4px; font-size: 12.5px; flex-wrap: wrap; }

    /* ── Paso a paso de una corrida EN_CURSO (que fuente se esta
       consultando en este momento) ───────────────────────────────────── */
    .run-steps { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
    .run-step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; color: var(--subtle); transition: color .15s; }
    .run-step-icon { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; }
    .run-step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .run-step-name { font-weight: 700; color: var(--ink); font-family: var(--font-mono, monospace); font-size: 11.5px; min-width: 90px; }
    .run-step-status { min-width: 84px; }
    .run-step-detail { font-size: 11.5px; }
    .run-step-en_curso { color: var(--primary); }
    .run-step-en_curso .run-step-name { color: var(--primary); }
    .run-step-completado .run-step-icon { color: var(--green); }
    .run-step-error { color: var(--red); }
    .run-step-error .run-step-icon { color: var(--red); }

    /* ── Toast (estilo "notice" del anexo: pastilla oscura inferior) ── */
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #172033; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 14px 34px rgba(15,23,42,.22); z-index: 9999; max-width: 320px; animation: toast-in .2s ease-out; }
    .toast.success { background: var(--primary); }
    .toast.error { background: var(--red); }

    .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .mt-4 { margin-top: 16px; } .mb-3 { margin-bottom: 12px; }
    .muted { color: var(--muted); }
    .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .text-mono { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    .spin.dark { border-color: rgba(15,107,91,.18); border-top-color: var(--primary); }
    .loader { padding: 32px; text-align: center; }

    .pipeline-banner { background: var(--primary-light); color: var(--primary); border: 1px solid var(--green-border); border-radius: 13px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); font-weight: 650; margin-bottom: 16px; }
    .pipeline-banner.done { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .pipeline-banner-detail { color: var(--muted); font-weight: 400; font-size: var(--fs-xs); }
    .inline-form { background: var(--panel-soft); border-top: 1px solid var(--line); padding: 16px 20px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .inline-form .field { margin-bottom: 0; flex: 1; min-width: 160px; }

    /* ── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 1180px) {
      .app { grid-template-columns: 1fr; padding: 14px; }
      .sidebar { position: relative; top: auto; min-height: auto; }
      .tabs { grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); grid-auto-flow: column; }
    }
    @media (max-width: 680px) {
      .main { padding: 16px; }
      .topbar { justify-content: flex-start; }
      .card-header { padding: 14px 16px; }
      .card-body { padding: 16px; }
      .inline-form { padding: 14px 16px; }
      .article-row { padding: 12px 16px; }
      .section-title { font-size: 20px; }
    }
    @media (max-width: 480px) {
      .article-row-head { flex-wrap: wrap; }
      .article-badges { justify-content: flex-start; flex-basis: 100%; flex-shrink: 1; width: 100%; }
    }
  </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <!-- ══════════════════════════════════════════════════════ LOGIN ══ -->
  <div x-show="!authenticated" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        Diario de la Salud
      </div>
      <p class="login-eyebrow">EcoFarma — Panel editorial</p>
      <p class="login-sub">Ingresa tus credenciales para acceder al panel</p>

      <div class="field">
        <label class="label">Correo</label>
        <input
          type="email"
          class="input"
          placeholder="nombre@ecofarma.co"
          x-model="loginEmail"
          @keydown.enter="$refs.loginPassword.focus()"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label class="label">Contraseña</label>
        <input
          type="password"
          class="input"
          placeholder="••••••••"
          x-model="loginPassword"
          x-ref="loginPassword"
          @keydown.enter="login()"
          autocomplete="current-password"
        />
      </div>

      <button class="btn btn-primary btn-full" @click="login()" :disabled="authLoading || !loginEmail.trim() || !loginPassword.trim()">
        <span x-show="authLoading" class="spin"></span>
        <span x-text="authLoading ? 'Verificando...' : 'Ingresar'"></span>
      </button>

      <div x-show="authError" class="error-msg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span x-text="authError"></span>
      </div>

      <p class="login-footer">
        Ingesta &rarr; reescritura IA &rarr; verificación &rarr; validación humana &rarr; publicación
      </p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════ DASHBOARD ══ -->
  <div x-show="authenticated" class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="header-logo">
          <img src="/assets/ecofarma-logo-white.webp" alt="EcoFarma" />
        </div>
        <p>Dashboard unificado de workflows</p>
        <span class="header-role" x-text="me?.role ?? ''"></span>
      </div>

      <div class="nav-group">
        <div class="nav-title">Workflows</div>
        <nav class="tabs">
          <button class="tab" :class="{ active: tab === 'articulos' }" @click="tab = 'articulos'; loadSection('articulos'); loadAllArticles(); loadRuns()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            Diario de la Salud
          </button>
        </nav>

        <div class="nav-subtitle">Filtrar por estado</div>
        <nav class="tabs tabs-nested">
          <button class="tab tab-sub" :class="{ active: tab === 'articulos' && articleStateFilter === 'all' }" @click="setArticleFilter('all')">
            Todos
            <span x-show="articles.length" class="tab-badge tab-badge-count" x-text="articles.length"></span>
          </button>
          <button class="tab tab-sub" :class="{ active: tab === 'articulos' && articleStateFilter === 'revision' }" @click="setArticleFilter('revision')">
            En revisión
            <span x-show="countByFilter('revision')" class="tab-badge tab-badge-count" x-text="countByFilter('revision')"></span>
          </button>
          <button class="tab tab-sub" :class="{ active: tab === 'articulos' && articleStateFilter === 'triage' }" @click="setArticleFilter('triage')">
            Triage
            <span x-show="countByFilter('triage')" class="tab-badge" x-text="countByFilter('triage')"></span>
          </button>
          <button class="tab tab-sub" :class="{ active: tab === 'articulos' && articleStateFilter === 'validado' }" @click="setArticleFilter('validado')">
            Validados
            <span x-show="countByFilter('validado')" class="tab-badge tab-badge-count" x-text="countByFilter('validado')"></span>
          </button>
          <button class="tab tab-sub" :class="{ active: tab === 'articulos' && articleStateFilter === 'publicado' }" @click="setArticleFilter('publicado')">
            Publicados
            <span x-show="countByFilter('publicado')" class="tab-badge tab-badge-count" x-text="countByFilter('publicado')"></span>
          </button>
          <button class="tab tab-sub" :class="{ active: tab === 'articulos' && articleStateFilter === 'rechazado' }" @click="setArticleFilter('rechazado')">
            Rechazados
            <span x-show="countByFilter('rechazado')" class="tab-badge tab-badge-count" x-text="countByFilter('rechazado')"></span>
          </button>
        </nav>
      </div>

      <div class="nav-group">
        <div class="nav-title">Blog</div>
        <nav class="tabs">
          <button class="tab" :class="{ active: tab === 'blog' }" @click="tab = 'blog'; loadSection('blog'); loadBlogHubs(); loadBlogPosts()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Blog (Excel)
          </button>
        </nav>
      </div>

      <div class="nav-group">
        <div class="nav-title">Inventario</div>
        <nav class="tabs">
          <button class="tab" :class="{ active: tab === 'inventario' }" @click="tab = 'inventario'; loadSection('inventario'); loadInventoryBranches(); loadInventoryProducts(); loadDistrimonacoSyncRuns(); loadSynonyms(); loadBlacklistEntries(); loadUnavailableWoocommerceProducts()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.91 8.84L8.56 21.19a2 2 0 0 1-2.83 0L3.16 18.6a2 2 0 0 1 0-2.83L15.5 3.42"/><path d="M3.5 8.5l3-3"/><path d="M13.5 22.5a5 5 0 0 1-7-7"/></svg>
            Inventario
          </button>
        </nav>
      </div>

      <div class="nav-group">
        <div class="nav-title">Panel</div>
        <nav class="tabs">
          <button class="tab" :class="{ active: tab === 'guia' }" @click="tab = 'guia'; loadSection('guia'); loadSourceStats(); loadSources(); loadPrompts()" title="Guía de uso">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Guía
          </button>
        </nav>
      </div>

      <div class="nav-group" x-show="me?.role === 'ADMIN'">
        <div class="nav-title">Usuarios</div>
        <nav class="tabs">
          <button class="tab" :class="{ active: tab === 'usuarios' }" @click="tab = 'usuarios'; loadSection('usuarios'); loadUsers()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Usuarios
          </button>
        </nav>
      </div>

      <div class="sidebar-foot">
        <div class="header-status">
          <span class="dot" :class="{ err: !health?.db }"></span>
          <span x-text="health?.db ? 'Conectado' : 'Sin BD'"></span>
        </div>
        <button
          class="btn-ghost"
          @click="triggerAllSources()"
          :disabled="triggerBusy"
          title="Ingiere de inmediato todas las fuentes activas, sin esperar su horario"
        >
          <span x-show="triggerBusy" class="spin dark"></span>
          <span x-text="triggerBusy ? 'Consultando...' : 'Consultar fuentes ahora'"></span>
        </button>
        <button class="btn-ghost" @click="logout()">Salir</button>
      </div>
    </aside>

    <main class="main">
      <div
        x-show="pipelineStatus.isActive || pipelineJustFinished"
        x-transition
        class="pipeline-banner"
        :class="{ done: !pipelineStatus.isActive && pipelineJustFinished }"
        style="display:none;"
      >
        <span x-show="pipelineStatus.isActive" class="spin dark"></span>
        <svg x-show="!pipelineStatus.isActive && pipelineJustFinished" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span class="pipeline-banner-text" x-text="pipelineStatus.isActive ? `Procesando pipeline -- ${pipelineStatus.totalPending} tarea(s) en curso o en cola` : 'Proceso del pipeline terminado'"></span>
        <span x-show="pipelineStatus.isActive && pipelineStageDetail()" class="pipeline-banner-detail" x-text="pipelineStageDetail()"></span>
      </div>

      <div x-show="tab === 'articulos'" id="section-articulos"></div>
      <div x-show="tab === 'blog'" id="section-blog"></div>
      <div x-show="tab === 'inventario'" id="section-inventario"></div>
      <div x-show="tab === 'chatbot-test'" id="section-chatbot-test"></div>
      <div x-show="tab === 'pedidos'" id="section-pedidos"></div>
      <div x-show="tab === 'guia'" id="section-guia"></div>
      <div x-show="tab === 'usuarios'" id="section-usuarios"></div>
    </main>
  </div>

  <div
    x-show="toast.show"
    x-transition.opacity
    class="toast"
    :class="toast.type"
    x-text="toast.msg"
    style="display:none;"
  ></div>

<script>
function app() {
  return {
    // Auth
    loginEmail: '',
    loginPassword: '',
    jwtToken: localStorage.getItem('ds_jwt') || '',
    authenticated: false,
    authLoading: false,
    authError: '',
    me: null,

    // Nav
    tab: 'articulos',
    _sectionsLoaded: {},

    // Health
    health: null,

    // Data
    // Vista unificada (2026-07-17, pedido explicito del usuario): un solo
    // arreglo con todos los estados relevantes para un humano (antes eran
    // 3 pestanas/arreglos separados: queue/triage/publishQueue). El filtro
    // de Estado del sidebar filtra sobre este mismo arreglo -- ver
    // filteredArticles().
    articles: [],
    articlesLoading: false,
    articleStateFilter: 'all',
    articlesPage: 1,
    articlesPageSize: 10,
    sources: [],
    sourcesLoading: false,
    sourceStats: [],
    sourceStatsLoading: false,
    promptTemplates: [],
    promptsLoading: false,
    pipelineStatus: { isActive: false, totalPending: 0, stages: [] },
    pipelineJustFinished: false,
    _pipelineInterval: null,
    _pipelineFinishedTimeout: null,
    triggerBusy: false,
    selectTopBusy: false,
    runs: [],
    runsLoading: false,
    runsPage: 1,
    runsPageSize: 5,
    scheduleAt: '',
    scheduleBusy: false,

    // Blog (Excel) -- independiente de Diario de la Salud, ver plan
    // dazzling-foraging-bear.md. Paginado y filtrado en el servidor
    // (blog.service.ts), no en el cliente como filteredArticles().
    blogPosts: [],
    blogPostsLoading: false,
    blogHubs: [],
    blogHubFilter: '',
    blogDraftFilter: '',
    blogPage: 1,
    blogPageSize: 20,
    blogMeta: { total: 0, totalPages: 1 },
    newBlogTitle: '',
    newBlogHub: '',
    newBlogBusy: false,
    newBlogSectionHeading: {},
    newBlogFaqQuestion: {},

    // Inventario -- alimenta al chatbot publico de disponibilidad/precio
    // (ver plan kind-giggling-cerf.md). Mantenimiento manual entre
    // importaciones de scripts/import-inventory-master.ts.
    inventoryProducts: [],
    inventoryProductsLoading: false,
    inventoryBranches: [],
    inventorySearch: '',
    inventoryCategoryFilter: '',
    inventoryPage: 1,
    inventoryPageSize: 20,
    inventoryMeta: { total: 0, totalPages: 1 },
    wooUnavailableProducts: [],
    wooUnavailableLoading: false,

    // Disponibilidad en WordPress -- marcar acá encola el cambio
    // (WoocommercePendingChange); el snippet de WordPress lo aplica en su
    // próxima corrida (~5 min). Sin copia local del catálogo completo (se
    // abandonó, ver docs/integracion-inventario-wordpress.md), así que la
    // búsqueda pega en vivo a /inventory/woocommerce/products.
    wooSearchQuery: '',
    wooSearchResults: [],
    wooSearchBusy: false,
    wooSearchDone: false,
    newProductSku: '',
    newProductName: '',
    newProductActiveIngredient: '',
    newProductCategory: '',
    newProductRequiresPrescription: false,
    newProductBusy: false,
    showAddProductForm: false,
    newBranchCode: '',
    newBranchName: '',
    newBranchBusy: false,
    distrimonacoSyncRuns: [],
    distrimonacoSyncBusy: false,
    synonyms: [],
    newSynonymTerm: '',
    newSynonymRelated: '',
    newSynonymBusy: false,

    // Lista Negra -- registro de referencia de productos que deben estar
    // bloqueados en WooCommerce (no aplica nada ahí, ver docs/
    // integracion-inventario-wordpress.md seccion 0).
    blacklistEntries: [],
    newBlacklistSku: '',
    newBlacklistName: '',
    newBlacklistReason: '',
    newBlacklistBusy: false,

    // Tarjetas colapsables de Inventario -- Disponibilidad en WordPress
    // abierta por defecto (pedido explicito del usuario 2026-08-02), el
    // resto colapsado hasta que el usuario las abra.
    invWooOpen: true,
    invSyncOpen: false,
    invSynonymsOpen: false,
    invBlacklistOpen: false,
    invBranchesOpen: false,
    invProductsOpen: false,

    // Probar chatbot -- llama a POST /chatbot/message tal cual lo haria
    // el widget publico (sin header de Authorization), para que la
    // prueba refleje exactamente la experiencia del cliente final,
    // incluido el mismo rate limiting.
    chatbotTestMessages: [],
    chatbotTestInput: '',
    chatbotTestBusy: false,
    chatbotTestConversationId: null,
    chatbotTestCart: { items: [], total: 0, notices: [] },
    chatbotTestCartFormOpen: false,
    chatbotTestCartName: '',
    chatbotTestCartPhone: '',
    chatbotTestCartBusy: false,
    // "status"/"pharmacist" ya funcionan (ver selectChatbotTestMenuOption)
    // pero quedan deshabilitados por pedido explicito del usuario
    // 2026-07-29 para el lanzamiento inicial -- se muestran igual con
    // tooltip "Disponible próximamente".
    chatbotTestMenuOptions: [
      { label: 'Buscar un producto', action: 'search' },
      { label: 'Ver el estado de mi solicitud', action: 'status', disabled: true },
      { label: 'Hablar con un farmacéutico', action: 'pharmacist', disabled: true },
      { label: 'Otra pregunta', action: 'other' },
    ],
    chatbotTestReferenceFormVisible: false,
    chatbotTestReferenceInput: '',

    // Pedidos (solicitudes armadas desde el carrito del chatbot)
    orders: [],
    ordersLoading: false,
    ordersStatusFilter: '',
    ordersPage: 1,
    ordersPageSize: 20,
    ordersMeta: { total: 0, totalPages: 1 },
    ordersPendingCount: 0,

    // Usuarios -- solo ADMIN ve esta pestana (RolesGuard tambien la exige
    // en el backend, esto es solo para no mostrar una opcion que fallaria).
    users: [],
    usersLoading: false,
    newUserEmail: '',
    newUserName: '',
    newUserPassword: '',
    newUserRole: 'VIEWER',
    newUserBusy: false,

    // UI
    toast: { show: false, msg: '', type: 'success' },

    async init() {
      if (this.jwtToken) {
        const ok = await this.tryConnect();
        if (!ok) { localStorage.removeItem('ds_jwt'); this.jwtToken = ''; }
      }
    },

    async loadSection(name) {
      if (this._sectionsLoaded[name]) return;
      this._sectionsLoaded[name] = true;
      const el = document.getElementById(`section-${name}`);
      if (!el) return;
      try {
        const res = await fetch(`/sections/${name}.html`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        el.innerHTML = await res.text();
      } catch (e) {
        this._sectionsLoaded[name] = false;
        el.innerHTML = `<div style="padding:32px;text-align:center;color:#dc2626;font-size:13px;">Error al cargar esta sección. Recarga la página.</div>`;
      }
    },

    // ── Auth ─────────────────────────────────────────────────────────────
    async login() {
      this.authError = '';
      if (!this.loginEmail.trim() || !this.loginPassword.trim()) return;
      this.authLoading = true;
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.loginEmail.trim(), password: this.loginPassword }),
        });
        const body = await r.json();
        if (!r.ok) { this.authError = body?.message || 'Credenciales inválidas'; return; }
        this.jwtToken = body.accessToken;
        const ok = await this.tryConnect();
        if (!ok) { this.authError = 'No se pudo conectar al servidor'; this.jwtToken = ''; }
      } catch {
        this.authError = 'Error al conectar con el servidor';
      } finally { this.authLoading = false; }
    },

    async tryConnect() {
      try {
        const meRes = await fetch('/auth/me', { headers: this.headers() });
        if (!meRes.ok) return false;
        this.me = await meRes.json();
        localStorage.setItem('ds_jwt', this.jwtToken);
        this.authenticated = true;
        await this.loadSection('articulos');
        await Promise.all([this.loadHealth(), this.loadAllArticles(), this.loadRuns(), this.refreshOrdersPendingCount()]);
        this.startPipelinePolling();
        return true;
      } catch { return false; }
    },

    logout() {
      localStorage.removeItem('ds_jwt');
      this.jwtToken = ''; this.loginEmail = ''; this.loginPassword = ''; this.authenticated = false;
      this.me = null; this.articles = []; this.sources = []; this.health = null; this.runs = []; this.blogPosts = [];
      this.inventoryProducts = []; this.inventoryBranches = []; this.distrimonacoSyncRuns = []; this.synonyms = [];
      this.chatbotTestMessages = []; this.chatbotTestConversationId = null;
      this.orders = []; this.ordersPendingCount = 0;
      this.users = [];
      clearInterval(this._pipelineInterval);
      this._pipelineInterval = null;
      this.pipelineStatus = { isActive: false, totalPending: 0, stages: [] };
      this.pipelineJustFinished = false;
    },

    // ── Indicador visual de proceso en curso / terminado ────────────────────
    // Consulta GET /pipeline/status (conteos reales de BullMQ, no un
    // estimado) para mostrar que el pipeline esta trabajando sin importar
    // que boton lo disparo (Correr ahora, Seleccionar mejores ahora, un
    // reintento automatico, Regenerar) y avisar claramente cuando termina.
    startPipelinePolling() {
      clearInterval(this._pipelineInterval);
      this.pollPipelineStatus();
      this._pipelineInterval = setInterval(() => this.pollPipelineStatus(), 3000);
    },

    async pollPipelineStatus() {
      try {
        const r = await this.get('/pipeline/status');
        if (!r.ok) return;
        const data = await r.json();
        const wasActive = this.pipelineStatus.isActive;
        this.pipelineStatus = data;
        if (wasActive && !data.isActive) {
          this.pipelineJustFinished = true;
          this.showToast('Proceso del pipeline terminado', 'success');
          this.refreshVisibleTab();
          clearTimeout(this._pipelineFinishedTimeout);
          this._pipelineFinishedTimeout = setTimeout(() => { this.pipelineJustFinished = false; }, 6000);
        } else if (data.isActive && this.tab === 'articulos') {
          // Pedido explicito del usuario 2026-07-17: ver que fuente se
          // esta consultando en este momento, paso a paso -- mismo
          // cadencia de 3s que ya usa este poll, sin loop nuevo.
          this.loadRuns({ silent: true });
        }
      } catch { /* silencioso -- es solo un indicador visual, no bloquea nada */ }
    },

    pipelineStageDetail() {
      return (this.pipelineStatus.stages || [])
        .filter((s) => s.waiting + s.active + s.delayed > 0)
        .map((s) => `${s.label}: ${s.waiting + s.active + s.delayed}`)
        .join(' · ');
    },

    // Recarga la pestana visible para que el resultado del proceso
    // aparezca solo, sin que el usuario tenga que darle "Actualizar".
    refreshVisibleTab() {
      if (this.tab === 'articulos') { this.loadAllArticles(); this.loadRuns(); }
      else if (this.tab === 'blog') { this.loadBlogPosts(); }
      else if (this.tab === 'inventario') { this.loadInventoryProducts(); }
      else if (this.tab === 'pedidos') { this.loadOrders(); }
      else if (this.tab === 'guia') { this.loadSourceStats(); this.loadSources(); }
    },

    async loadHealth() {
      try { const r = await fetch('/health'); if (r.ok) this.health = await r.json(); } catch {}
    },

    // ── Artículos (vista unificada: revisión + triage + validado + rechazado + publicado) ──
    async loadAllArticles() {
      this.articlesLoading = true;
      try {
        const r = await this.get('/validation/all');
        if (r.ok) {
          this.articles = (await r.json()).map(a => ({
            ...a, _open: false, _busy: false,
            _editedTitle: a.rewrittenTitle, _editedSummary: a.rewrittenSummary, _editedContent: a.rewrittenContent,
          }));
          this.articlesPage = 1;
        }
      } finally { this.articlesLoading = false; }
    },

    // Filtro de Estado del sidebar -- sobre el mismo arreglo, sin volver
    // a pedirle nada al backend (mismo patron que los filtros del anexo).
    filteredArticles() {
      const triageStates = ['GROUNDING_FALLIDO', 'CUMPLIMIENTO_FALLIDO', 'ERROR'];
      switch (this.articleStateFilter) {
        case 'revision':  return this.articles.filter(a => a.state === 'EN_VALIDACION');
        case 'triage':    return this.articles.filter(a => triageStates.includes(a.state));
        case 'validado':  return this.articles.filter(a => a.state === 'VALIDADO');
        case 'publicado': return this.articles.filter(a => a.state === 'PUBLICADO');
        case 'rechazado': return this.articles.filter(a => a.state === 'RECHAZADO');
        default:          return this.articles;
      }
    },

    setArticleFilter(filter) {
      this.tab = 'articulos';
      this.loadSection('articulos');
      this.articleStateFilter = filter;
      this.articlesPage = 1;
    },

    // Paginacion (2026-07-17, pedido explicito del usuario): no mas de
    // articlesPageSize (10) filas a la vez, tanto en la tabla como en las
    // tarjetas de Publicados -- ambas vistas leen del mismo
    // filteredArticles(), asi que una sola paginacion sirve para las dos.
    totalPages() {
      return Math.max(1, Math.ceil(this.filteredArticles().length / this.articlesPageSize));
    },
    paginatedArticles() {
      const start = (this.articlesPage - 1) * this.articlesPageSize;
      return this.filteredArticles().slice(start, start + this.articlesPageSize);
    },
    goToPage(n) {
      this.articlesPage = Math.min(Math.max(1, n), this.totalPages());
    },

    countByFilter(filter) {
      const prev = this.articleStateFilter;
      this.articleStateFilter = filter;
      const n = this.filteredArticles().length;
      this.articleStateFilter = prev;
      return n;
    },

    articleFilterLabel(filter) {
      return {
        all: 'Todos', revision: 'En revisión', triage: 'Triage',
        validado: 'Validados', publicado: 'Publicados', rechazado: 'Rechazados',
      }[filter] || filter;
    },

    articleStateLabel(state) {
      return {
        EN_VALIDACION: 'En revisión', GROUNDING_FALLIDO: 'Triage: fidelidad',
        CUMPLIMIENTO_FALLIDO: 'Triage: cumplimiento', ERROR: 'Triage: error técnico',
        VALIDADO: 'Validado', RECHAZADO: 'Rechazado', PUBLICADO: 'Publicado',
      }[state] || state;
    },

    async validateArticle(a, decision) {
      a._busy = true;
      try {
        const payload = { decision };
        if (decision === 'RECHAZADO') {
          payload.notes = prompt('Motivo del rechazo (opcional):') || undefined;
        } else if (decision === 'EDITADO_Y_VALIDADO') {
          payload.editedTitle = a._editedTitle;
          payload.editedSummary = a._editedSummary;
          payload.editedContent = a._editedContent;
        }
        const r = await this.post(`/validation/${a.id}/validate`, payload);
        if (r.ok) {
          const updated = await r.json();
          Object.assign(a, updated, { _open: false, _busy: false });
          this.showToast(decision === 'RECHAZADO' ? 'Artículo rechazado' : 'Artículo validado');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.detail || b?.message || 'Error al validar', 'error');
        }
      } finally { a._busy = false; }
    },

    async regenerate(a) {
      a._busy = true;
      try {
        const r = await this.post(`/validation/${a.id}/regenerate`, {});
        if (r.ok) {
          // Vuelve a REESCRITO (fuera de esta vista) hasta que el pipeline
          // la resuelva de nuevo -- se quita de la lista local, no hace
          // falta pedir todo el arreglo otra vez.
          this.articles = this.articles.filter(x => x.id !== a.id);
          this.showToast('Reescritura reencolada');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.detail || b?.message || 'No se pudo regenerar', 'error');
        }
      } finally { a._busy = false; }
    },

    async publishArticle(a) {
      a._busy = true;
      try {
        const r = await this.post(`/publish/${a.id}/publish`, {});
        if (r.ok) {
          const updated = await r.json();
          Object.assign(a, updated, { _open: false, _busy: false });
          this.showToast('Artículo publicado');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.detail || b?.message || 'Error al publicar', 'error');
        }
      } finally { a._busy = false; }
    },

    async loadBlogPosts() {

    goToBlogPage(n) {

    // Detalle (sections + faqs) se pide bajo demanda al abrir la fila --
    // la lista solo trae _count, no el contenido completo de cada H2/FAQ.
    async openBlogPost(post) {
      post._open = !post._open;
      if (!post._open || post._loaded) return;
      post._detailBusy = true;
      try {
        const r = await this.get(`/blog/posts/${post.id}`);
        if (r.ok) {
          const detail = await r.json();
          post.sections = detail.sections.map((s) => ({ ...s, _editedBody: s.body || '', _busy: false }));
          post.faqs = detail.faqs.map((f) => ({ ...f, _editedAnswer: f.answer || '', _busy: false }));
          post._editedTitle = detail.title;
          post._editedSlug = detail.slug;
          post._editedDraftStatus = detail.draftStatus;
          post._loaded = true;
        } else {
          this.showToast('No se pudo cargar el post', 'error');
        }
      } finally { post._detailBusy = false; }
    },

    async saveBlogPost(post) {
      post._saveBusy = true;
      try {
        const r = await this.patch(`/blog/posts/${post.id}`, {
          title: post._editedTitle,
          slug: post._editedSlug,
          draftStatus: post._editedDraftStatus,
        });
        if (r.ok) {
          const updated = await r.json();
          post.title = updated.title; post.slug = updated.slug; post.draftStatus = updated.draftStatus;
          this.showToast('Post actualizado');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar el post', 'error');
        }
      } finally { post._saveBusy = false; }
    },

    async saveBlogSection(post, section) {

          this.showToast('Sección guardada');

          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar la sección', 'error');
        }
      } finally { section._busy = false; }
    },

    async saveBlogFaq(post, faq) {

      try {

    blogDraftStatusLabel(status) {
      return { PENDIENTE_REDACCION: 'Pendiente de redacción', EN_REDACCION: 'En redacción', REDACTADO: 'Redactado' }[status] || status;
    },
    blogDraftStatusBadge(status) {
      return { PENDIENTE_REDACCION: 'badge-gray', EN_REDACCION: 'badge-amber', REDACTADO: 'badge-green' }[status] || 'badge-gray';
    },

    async createBlogPost() {
      if (!this.newBlogTitle.trim() || !this.newBlogHub.trim()) return;
      this.newBlogBusy = true;
      try {
        const r = await this.post('/blog/posts', { title: this.newBlogTitle.trim(), hub: this.newBlogHub.trim() });
        if (r.ok) {
          const created = await r.json();
          this.blogPosts.unshift({ ...created, _count: { sections: 0, faqs: 0 }, _open: false, _detailBusy: false, _saveBusy: false });
          this.blogMeta.total += 1;
          this.newBlogTitle = ''; this.newBlogHub = '';
          this.showToast('Post creado -- sigue sin publicar hasta que lo redactes y publiques');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo crear el post', 'error');
        }
      } finally { this.newBlogBusy = false; }
    },

    // Igual que las FAQs/secciones existentes, se agregan una por una desde
    // el detalle abierto del post -- el input de texto vive en
    // newBlogSectionHeading[post.id]/newBlogFaqQuestion[post.id] (un valor
    // por post, indexado por id, ya que puede haber varios detalles
    // abiertos a la vez en la lista).
    // Nota: no se usa this.post(...) aqui a proposito -- estos metodos se
    // invocan desde dentro de x-for="post in blogPosts", y Alpine sombrea
    // this.post (el helper HTTP) con el item del loop mientras dura esa
    // evaluacion, dejando "this.post is not a function". this._fetch
    // evita el nombre en conflicto sin tener que renombrar la variable del
    // x-for en toda la plantilla existente.
    async addBlogSection(post) {
      const heading = (this.newBlogSectionHeading[post.id] || '').trim();
      if (!heading) return;
      post._addSectionBusy = true;
      try {
        const r = await this._fetch(`/blog/posts/${post.id}/sections`, { method: 'POST', headers: this.headers(), body: JSON.stringify({ heading }) });
        if (r.ok) {
          const created = await r.json();
          post.sections.push({ ...created, _editedBody: created.body || '', _busy: false });
          post._count.sections += 1;
          this.newBlogSectionHeading[post.id] = '';
          this.showToast('Sección agregada');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo agregar la sección', 'error');
        }
      } finally { post._addSectionBusy = false; }
    },

    async addBlogFaq(post) {
      const question = (this.newBlogFaqQuestion[post.id] || '').trim();
      if (!question) return;
      post._addFaqBusy = true;
      try {
        const r = await this._fetch(`/blog/posts/${post.id}/faqs`, { method: 'POST', headers: this.headers(), body: JSON.stringify({ question }) });
        if (r.ok) {
          const created = await r.json();
          post.faqs.push({ ...created, _editedAnswer: created.answer || '', _busy: false });
          post._count.faqs += 1;
          this.newBlogFaqQuestion[post.id] = '';
          this.showToast('FAQ agregada');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo agregar la FAQ', 'error');
        }
      } finally { post._addFaqBusy = false; }
    },

    // Unica accion que hace que el post aparezca en WordPress (via
    // GET /blog/public) -- ver comentario en BlogService.publishPost.
    async toggleBlogPublish(post) {
      post._publishBusy = true;
      try {
        const action = post.published ? 'unpublish' : 'publish';
        const r = await this._fetch(`/blog/posts/${post.id}/${action}`, { method: 'POST', headers: this.headers(), body: JSON.stringify({}) });
        if (r.ok) {
          const updated = await r.json();
          post.published = updated.published;
          post.publishedAt = updated.publishedAt;
          this.showToast(post.published ? 'Post publicado -- ya visible en WordPress' : 'Post despublicado');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo cambiar el estado de publicación', 'error');
        }
      } finally { post._publishBusy = false; }
    },

    // Invocados desde dentro de x-for="post in blogPosts" -- usan
    // this._fetch directo, nunca this.post(...) (colisiona con la
    // variable de loop "post", ver docs/integracion-wordpress-diario-salud.md
    // seccion 11). FormData: sin Content-Type manual, el navegador arma el
    // boundary multipart solo -- por eso no se usa this.headers() aqui.
    async uploadBlogImage(post, event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      post._imageBusy = true;
      try {
        const formData = new FormData();
        formData.append('file', file);
        const r = await this._fetch(`/blog/posts/${post.id}/image`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${this.jwtToken}` },
          body: formData,
        });
        if (r.ok) {
          const updated = await r.json();
          post.imageUrl = updated.imageUrl;
          this.showToast('Imagen subida');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo subir la imagen', 'error');
        }
      } finally { post._imageBusy = false; }
    },
    async removeBlogImage(post) {
      post._imageBusy = true;
      try {
        const r = await this._fetch(`/blog/posts/${post.id}/image`, { method: 'DELETE', headers: this.headers() });
        if (r.ok) {
          post.imageUrl = null;
          this.showToast('Imagen eliminada');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo quitar la imagen', 'error');
        }
      } finally { post._imageBusy = false; }
    },

    // ── Inventario (alimenta al chatbot publico) ────────────────────────
    async loadInventoryBranches() {

    async loadUnavailableWoocommerceProducts() {
      this.wooUnavailableLoading = true;
      try {
        const r = await this.get('/inventory/woocommerce/unavailable');
        if (r.ok) this.wooUnavailableProducts = (await r.json()).map((p) => ({ ...p, _busy: false, _stockBusy: false }));
      } catch {
      } finally { this.wooUnavailableLoading = false; }
    },

    async searchWoocommerceProducts() {
      const q = this.wooSearchQuery.trim();
      if (q.length < 2) { this.showToast('Escribe al menos 2 caracteres', 'error'); return; }
      this.wooSearchBusy = true;
      this.wooSearchDone = false;
      try {
        const r = await this.get(`/inventory/woocommerce/products?q=${encodeURIComponent(q)}`);
        if (r.ok) {
          this.wooSearchResults = (await r.json()).map((p) => ({ ...p, _busy: false, _stockBusy: false }));
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo buscar en WooCommerce', 'error');
          this.wooSearchResults = [];
        }
      } catch {
        this.showToast('No se pudo conectar con el backend', 'error');
        this.wooSearchResults = [];
      } finally {
        this.wooSearchBusy = false;
        this.wooSearchDone = true;
      }
    },

    // Estado que el admin ve como "actual": si hay un cambio en cola, ese es
    // el que cuenta para el botón (si no, tocar dos veces volvería a encolar
    // lo mismo en vez de deshacerlo). catalogVisibility/stockStatus siguen
    // siendo el estado REAL en WooCommerce y se muestran aparte.
    wooEffectiveHidden(product) {
      return product.pendingHidden !== undefined ? product.pendingHidden : product.catalogVisibility === 'hidden';
    },

    wooEffectiveOutOfStock(product) {
      return product.pendingOutOfStock !== undefined ? product.pendingOutOfStock : product.stockStatus === 'outofstock';
    },

    // La respuesta OMITE estos campos cuando no aplican, y Object.assign no
    // borra lo que no viene -- sin esto un "Falló" viejo quedaría pegado en
    // pantalla después de reintentar.
    wooResetChangeFlags(product, updated) {
      for (const k of ['pendingHidden', 'pendingOutOfStock', 'failedHidden', 'failedHiddenError', 'failedOutOfStock', 'failedOutOfStockError']) {
        product[k] = updated[k];
      }
    },

    async toggleWoocommerceAvailability(product) {
      product._busy = true;
      try {
        const hidden = !this.wooEffectiveHidden(product);
        const r = await this.patch(`/inventory/woocommerce/products/${product.id}/availability`, { hidden });
        if (r.ok) {
          const updated = await r.json();
          this.wooResetChangeFlags(product, updated);
          Object.assign(product, updated);
          this.showToast(hidden ? 'Cambio encolado: quedará no disponible en unos minutos' : 'Cambio encolado: quedará disponible en unos minutos');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo encolar el cambio', 'error');
        }
      } finally { product._busy = false; }
    },

    async toggleWoocommerceStockStatus(product) {
      product._stockBusy = true;
      try {
        const outOfStock = !this.wooEffectiveOutOfStock(product);
        const r = await this.patch(`/inventory/woocommerce/products/${product.id}/stock-status`, { outOfStock });
        if (r.ok) {
          const updated = await r.json();
          this.wooResetChangeFlags(product, updated);
          Object.assign(product, updated);
          this.showToast(outOfStock ? 'Cambio encolado: quedará agotado en unos minutos' : 'Cambio encolado: quedará con stock en unos minutos');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo encolar el cambio', 'error');
        }
      } finally { product._stockBusy = false; }
    },

    async loadInventoryProducts() {
      this.inventoryProductsLoading = true;
      try {
        const params = new URLSearchParams({ page: this.inventoryPage, pageSize: this.inventoryPageSize });
        if (this.inventorySearch) params.set('q', this.inventorySearch);
        if (this.inventoryCategoryFilter) params.set('category', this.inventoryCategoryFilter);
        const r = await this.get(`/inventory/products?${params}`);
        if (r.ok) {
          const body = await r.json();
          this.inventoryProducts = body.data.map((p) => ({ ...p, _open: false, _saveBusy: false }));
          this.inventoryMeta = body.meta;
        }
      } finally { this.inventoryProductsLoading = false; }
    },

    goToInventoryPage(n) {
      this.inventoryPage = Math.min(Math.max(1, n), this.inventoryMeta.totalPages);
      this.loadInventoryProducts();
    },

    async createProduct() {
      this.newProductBusy = true;
      try {
        const r = await this.post('/inventory/products', {
          sku: this.newProductSku.trim(),
          name: this.newProductName.trim(),
          activeIngredient: this.newProductActiveIngredient.trim() || undefined,
          category: this.newProductCategory.trim() || undefined,
          requiresPrescription: this.newProductRequiresPrescription,
        });
        if (r.ok) {
          this.newProductSku = ''; this.newProductName = ''; this.newProductActiveIngredient = '';
          this.newProductCategory = ''; this.newProductRequiresPrescription = false;
          this.showAddProductForm = false;
          this.showToast('Producto creado');
          this.inventoryPage = 1;
          this.loadInventoryProducts();
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo crear el producto', 'error');
        }
      } finally { this.newProductBusy = false; }
    },

    // Al abrir la fila arma _stockByBranch con TODAS las sucursales (no
    // solo las que ya tienen ProductStock) -- la fila de una sucursal sin
    // stock todavia se edita igual y se crea al guardar (upsertStock).
    openInventoryProduct(product) {
      product._open = !product._open;
      if (!product._open || product._loaded) return;
      product._editedName = product.name;
      product._editedActiveIngredient = product.activeIngredient || '';
      product._editedCategory = product.category || '';
      product._editedDescription = product.description || '';
      product._editedRequiresPrescription = product.requiresPrescription;
      product._editedIsActive = product.isActive;
      product._editedHiddenFromCatalog = product.hiddenFromCatalog;
      product._stockByBranch = this.inventoryBranches.map((branch) => {
        const existing = product.stock.find((s) => s.branchId === branch.id);
        return {
          branchId: branch.id,
          branchName: branch.name,
          quantity: existing ? existing.quantity : 0,
          price: existing ? Number(existing.price) : 0,
          _busy: false,
        };
      });
      product._loaded = true;
    },

    async saveInventoryProduct(product) {
      product._saveBusy = true;
      try {
        const r = await this.patch(`/inventory/products/${product.id}`, {
          name: product._editedName,
          activeIngredient: product._editedActiveIngredient || null,
          category: product._editedCategory || null,
          description: product._editedDescription || null,
          requiresPrescription: product._editedRequiresPrescription,
          isActive: product._editedIsActive,
          hiddenFromCatalog: product._editedHiddenFromCatalog,
        });
        if (r.ok) {
          Object.assign(product, await r.json());
          this.showToast('Producto actualizado');
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar el producto', 'error');
        }
      } finally { product._saveBusy = false; }
    },

    async saveInventoryStock(product, stockRow) {
      stockRow._busy = true;
      try {
        const r = await this.patch(`/inventory/products/${product.id}/stock/${stockRow.branchId}`, {
          quantity: Number(stockRow.quantity),
          price: Number(stockRow.price),
        });
        if (r.ok) {
          const updated = await r.json();
          const existing = product.stock.find((s) => s.branchId === stockRow.branchId);
          if (existing) Object.assign(existing, updated);
          else product.stock.push(updated);
          this.showToast(`Stock actualizado (${stockRow.branchName})`);
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message?.[0] || b?.message || 'No se pudo guardar el stock', 'error');
        }
      } finally { stockRow._busy = false; }
    },

    async syncDistrimonacoNow() {

      } finally { this.distrimonacoSyncBusy = false; }
    },

    // ── Probar chatbot (como lo veria el cliente final) ─────────────────
    async sendChatbotTestMessage() {
      const text = this.chatbotTestInput.trim();
      if (!text) return;
      this.chatbotTestMessages.push({ role: 'user', text });
      this.chatbotTestInput = '';
      this.chatbotTestBusy = true;
      try {
        const res = await fetch('/chatbot/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: this.chatbotTestConversationId || undefined, message: text }),
        });
        if (res.status === 429) {
          this.chatbotTestMessages.push({ role: 'error', text: 'Demasiados mensajes -- espera un momento (mismo límite que ve un cliente real).' });
          return;
        }
        if (!res.ok) {
          const b = await res.json().catch(() => ({}));
          this.chatbotTestMessages.push({ role: 'error', text: b?.message || 'No se pudo enviar el mensaje.' });
          return;
        }
        const body = await res.json();
        this.chatbotTestConversationId = body.conversationId;
        this.chatbotTestMessages.push({
          role: 'bot',
          text: body.reply,
          products:
            Array.isArray(body.products) && body.products.length > 1
              ? body.products.map((p) => ({ ...p, _qty: 1 }))
              : null,
        });
        await this.refreshChatbotTestCart();
      } catch {
        this.chatbotTestMessages.push({ role: 'error', text: 'No se pudo conectar con el chatbot.' });
      } finally {
        this.chatbotTestBusy = false;
        this.$nextTick(() => {
          const el = document.getElementById('chatbot-test-messages');
          if (el) el.scrollTop = el.scrollHeight;
        });
      }
    },

    resetChatbotTestConversation() {
      this.chatbotTestMessages = [];
      this.chatbotTestConversationId = null;
      this.chatbotTestCart = { items: [], total: 0, notices: [] };
      this.chatbotTestCartFormOpen = false;
      this.chatbotTestCartName = '';
      this.chatbotTestCartPhone = '';
      this.chatbotTestReferenceFormVisible = false;
      this.chatbotTestReferenceInput = '';
    },

    // ── Menú de opciones (estilo Farmatodo) ─────────────────────────────
    showChatbotTestMenu() {
      this.chatbotTestMessages.push({ role: 'menu' });
    },

    async selectChatbotTestMenuOption(idx, opt) {
      this.chatbotTestMessages.splice(idx, 1);
      this.chatbotTestMessages.push({ role: 'user', text: opt.label });
      if (opt.action === 'search') {
        this.chatbotTestMessages.push({ role: 'bot', text: 'Cuéntame qué producto buscas (nombre, principio activo, o para qué lo necesitas) y reviso disponibilidad y precio.' });
      } else if (opt.action === 'pharmacist') {
        this.chatbotTestMessages.push({
          role: 'bot',
          text: 'Nuestro personal farmacéutico te puede asesorar directamente en sucursal o por teléfono. Si mientras tanto quieres que revise disponibilidad, precio o alternativas de algún producto, dime cuál y con gusto te ayudo.',
        });
      } else if (opt.action === 'other') {
        this.chatbotTestMessages.push({ role: 'bot', text: 'Claro, cuéntame en qué te ayudo.' });
      } else if (opt.action === 'status') {
        this.chatbotTestMessages.push({ role: 'bot', text: 'Indícame el número de referencia de tu solicitud (ej. AEA5DCBE).' });
        this.chatbotTestReferenceFormVisible = true;
      }
    },

    async submitChatbotTestReference() {
      const ref = this.chatbotTestReferenceInput.trim();
      if (!ref) return;
      this.chatbotTestReferenceFormVisible = false;
      this.chatbotTestReferenceInput = '';
      this.chatbotTestMessages.push({ role: 'user', text: ref });
      try {
        const r = await fetch(`/chatbot/cart/status/${encodeURIComponent(ref)}`);
        if (r.status === 404) {
          this.chatbotTestMessages.push({ role: 'error', text: 'No encontramos una solicitud con ese número de referencia -- verifica que esté completo.' });
          return;
        }
        if (!r.ok) {
          this.chatbotTestMessages.push({ role: 'error', text: 'No se pudo consultar el estado en este momento.' });
          return;
        }
        const body = await r.json();
        const statusLabel = { PENDIENTE: 'Pendiente de confirmación', CONFIRMADO: 'Confirmada', CANCELADO: 'Cancelada' }[body.status] || body.status;
        const itemsText = body.items.map((i) => `${i.quantity}x ${i.name}`).join(', ');
        this.chatbotTestMessages.push({
          role: 'bot',
          text: `Solicitud #${body.reference}: ${statusLabel}.\nProductos: ${itemsText}\nTotal: ${this.formatPrice(body.total)}`,
        });
      } catch {
        this.chatbotTestMessages.push({ role: 'error', text: 'No se pudo conectar para consultar el estado.' });
      }
    },

    // Carrito de prueba -- llama a /chatbot/cart/* tal cual el widget
    // publico, 100% determinista (ver ChatCartService).
    async refreshChatbotTestCart() {
      if (!this.chatbotTestConversationId) return;
      try {
        const r = await fetch(`/chatbot/cart?conversationId=${this.chatbotTestConversationId}`);
        if (r.ok) this.chatbotTestCart = await r.json();
      } catch {}
    },

    async addToChatbotTestCart(product, quantity) {
      if (!this.chatbotTestConversationId) return;
      try {
        const r = await fetch('/chatbot/cart/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: this.chatbotTestConversationId, sku: product.sku, quantity }),
        });
        if (!r.ok) {
          const b = await r.json().catch(() => ({}));
          this.chatbotTestMessages.push({ role: 'error', text: b?.message || 'No se pudo actualizar el carrito.' });
          return;
        }
        this.chatbotTestCart = await r.json();
        if (quantity > 0) {
          this.chatbotTestMessages.push({ role: 'bot', text: `Agregaste ${quantity}x ${product.name} a tu solicitud.` });
          this.chatbotTestCart.notices.forEach((n) => this.chatbotTestMessages.push({ role: 'notice', text: n }));
        }
      } catch {
        this.chatbotTestMessages.push({ role: 'error', text: 'No se pudo conectar para actualizar el carrito.' });
      }
    },

    removeFromChatbotTestCart(sku) {
      this.addToChatbotTestCart({ sku, name: '' }, 0);
    },

    async submitChatbotTestCart() {
      if (!this.chatbotTestCartName.trim() || !this.chatbotTestCartPhone.trim()) {
        this.chatbotTestMessages.push({ role: 'error', text: 'Necesitas nombre y teléfono para enviar la solicitud.' });
        return;
      }
      this.chatbotTestCartBusy = true;
      try {
        const r = await fetch('/chatbot/cart/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversationId: this.chatbotTestConversationId,
            customerName: this.chatbotTestCartName.trim(),
            customerPhone: this.chatbotTestCartPhone.trim(),
          }),
        });
        if (!r.ok) {
          const b = await r.json().catch(() => ({}));
          this.chatbotTestMessages.push({ role: 'error', text: b?.message?.[0] || b?.message || 'No se pudo enviar la solicitud.' });
          return;
        }
        const body = await r.json();
        this.chatbotTestMessages.push({ role: 'bot', text: `¡Listo! Solicitud #${body.reference} registrada. El personal la confirmará por su cuenta.` });
        this.chatbotTestCart = { items: [], total: 0, notices: [] };
        this.chatbotTestCartFormOpen = false;
        this.chatbotTestCartName = '';
        this.chatbotTestCartPhone = '';
      } finally { this.chatbotTestCartBusy = false; }
    },

    // ── Pedidos (solicitudes del carrito del chatbot) ───────────────────
    async refreshOrdersPendingCount() {
      try {
        const r = await this.get('/orders?status=PENDIENTE&page=1&pageSize=1');
        if (r.ok) this.ordersPendingCount = (await r.json()).meta.total;
      } catch {}
    },

    async loadOrders() {
      this.ordersLoading = true;
      try {
        const params = new URLSearchParams({ page: this.ordersPage, pageSize: this.ordersPageSize });
        if (this.ordersStatusFilter) params.set('status', this.ordersStatusFilter);
        const [listRes] = await Promise.all([this.get(`/orders?${params}`), this.refreshOrdersPendingCount()]);
        if (listRes.ok) {
          const body = await listRes.json();
          this.orders = body.data;
          this.ordersMeta = body.meta;
        }
      } finally { this.ordersLoading = false; }
    },

    goToOrdersPage(n) {
      this.ordersPage = Math.min(Math.max(1, n), this.ordersMeta.totalPages);
      this.loadOrders();
    },

    async setOrderStatus(order, status) {

        const r = await this.patch(`/orders/${order.id}`, { status });
        if (r.ok) {
          Object.assign(order, await r.json());
          this.showToast(status === 'CONFIRMADO' ? 'Pedido confirmado' : 'Pedido cancelado');
          this.loadOrders();
        } else {
          const b = await r.json().catch(() => ({}));
          this.showToast(b?.message || 'No se pudo actualizar el pedido', 'error');
        }
      } finally { order._busy = false; }
