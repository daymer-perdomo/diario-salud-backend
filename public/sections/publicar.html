      <p class="section-title">Publicar en WordPress</p>
      <p class="section-sub">Artículos ya validados por un humano. Primero se crea el borrador en WordPress y luego se publica — dos pasos explícitos, nunca automáticos.</p>

      <div class="card">
        <div class="card-header">
          <span class="card-title" x-text="`${publishQueue.length} artículo${publishQueue.length !== 1 ? 's' : ''} validado(s)`"></span>
          <button class="btn btn-secondary btn-sm" @click="loadPublishQueue()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Actualizar
          </button>
        </div>

        <div x-show="publishQueueLoading" class="loader"><span class="spin dark"></span></div>

        <div x-show="!publishQueueLoading && !publishQueue.length" class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <p>No hay artículos validados esperando publicación</p>
        </div>

        <div x-show="!publishQueueLoading && publishQueue.length">
          <table class="table">
            <thead>
              <tr>
                <th>Artículo</th>
                <th>Validado</th>
                <th>Estado WordPress</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="a in publishQueue" :key="a.id">
                <tr>
                  <td>
                    <div class="flex items-center gap-2">
                      <img x-show="a.imageUrl" :src="a.imageUrl" alt="" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;" />
                      <div>
                        <div class="truncate" style="max-width:320px;" x-text="a.rewrittenTitle || a.originalTitle"></div>
                        <div class="muted" style="font-size:var(--fs-xs);margin-top:2px;" x-text="a.sourceInstitution"></div>
                      </div>
                    </div>
                  </td>
                  <td class="muted" x-text="timeAgo(a.validatedAt)"></td>
                  <td>
                    <span class="badge" :class="a.wordpressPostId ? 'badge-blue' : 'badge-gray'"
                      x-text="a.wordpressPostId ? `Borrador #${a.wordpressPostId}` : 'Sin borrador'"></span>
                  </td>
                  <td>
                    <div class="flex gap-2">
                      <button class="btn btn-secondary btn-sm" @click="createDraft(a)" :disabled="a._busy || a.wordpressPostId">
                        <span x-show="a._busy" class="spin dark"></span>
                        Crear borrador
                      </button>
                      <button class="btn btn-primary btn-sm" @click="publishArticle(a)" :disabled="a._busy || !a.wordpressPostId">
                        <span x-show="a._busy" class="spin"></span>
                        Publicar
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
