      <p class="section-title">Cola de validación</p>
      <p class="section-sub">Artículos reescritos por IA, con fidelidad y cumplimiento aprobados, esperando la decisión de un humano antes de publicarse.</p>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Corridas de ingesta</span>
          <button class="btn btn-secondary btn-sm" @click="loadRuns()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Actualizar
          </button>
        </div>

        <div x-show="me?.role === 'ADMIN' || me?.role === 'EDITOR'" class="inline-form">
          <button class="btn btn-primary btn-sm" @click="triggerAllSources()" :disabled="triggerBusy" title="Ingiere de inmediato todas las fuentes activas">
            <span x-show="triggerBusy" class="spin"></span>
            <span x-text="triggerBusy ? 'Consultando...' : 'Correr ahora'"></span>
          </button>

          <div class="field">
            <label class="label">Programar corrida</label>
            <input type="datetime-local" class="input" x-model="scheduleAt" />
          </div>
          <button class="btn btn-secondary btn-sm" @click="scheduleRun()" :disabled="scheduleBusy || !scheduleAt">
            <span x-show="scheduleBusy" class="spin dark"></span>
            Programar
          </button>
        </div>

        <div x-show="runsLoading" class="loader"><span class="spin dark"></span></div>

        <div x-show="!runsLoading && !runs.length" class="empty">
          <p>Aún no hay corridas registradas</p>
        </div>

        <div x-show="!runsLoading && runs.length">
          <template x-for="run in runs" :key="run.id">
            <div class="article-row" style="cursor:default;">
              <div class="article-row-head">
                <div style="min-width:0;flex:1;">
                  <div class="flex items-center gap-2">
                    <span class="badge" :class="runStatusBadge(run.status)" x-text="runStatusLabel(run.status)"></span>
                    <span class="muted" style="font-size:var(--fs-xs);" x-text="run.triggerType === 'SCHEDULED' ? 'Automática' : 'Manual'"></span>
                  </div>
                  <div class="article-meta">
                    <span x-show="run.status === 'PROGRAMADO'" x-text="`Programada para ${formatDateTime(run.startedAt)}`"></span>
                    <span x-show="run.status !== 'PROGRAMADO'" x-text="`Inicio: ${formatDateTime(run.startedAt)} · Fin: ${run.status === 'EN_CURSO' ? 'en curso' : formatDateTime(run.finishedAt)}`"></span>
                    <span x-show="run.sourceCodes?.length" x-text="` · ${run.sourceCodes.length} fuente(s)`"></span>
                  </div>
                </div>
                <button
                  x-show="run.status === 'PROGRAMADO' && (me?.role === 'ADMIN' || me?.role === 'EDITOR')"
                  class="btn btn-danger btn-sm"
                  @click="cancelRun(run)"
                  :disabled="run._busy"
                >
                  <span x-show="run._busy" class="spin"></span>
                  Cancelar
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title" x-text="`${queue.length} artículo${queue.length !== 1 ? 's' : ''} en cola`"></span>
          <button class="btn btn-secondary btn-sm" @click="loadQueue()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Actualizar
          </button>
        </div>

        <div x-show="queueLoading" class="loader"><span class="spin dark"></span></div>

        <div x-show="!queueLoading && !queue.length" class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <p>No hay artículos esperando validación</p>
        </div>

        <div x-show="!queueLoading && queue.length">
          <template x-for="a in queue" :key="a.id">
            <div class="article-row" @click="a._open = !a._open">
              <div class="article-row-head">
                <div style="min-width:0;flex:1;">
                  <div class="flex items-center gap-2">
                    <svg class="chevron" :class="{ open: a._open }" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    <span class="article-title" x-text="a.rewrittenTitle || a.originalTitle"></span>
                  </div>
                  <div class="article-meta" x-text="`${a.sourceInstitution} · ${timeAgo(a.createdAt)}`"></div>
                </div>
                <div class="article-badges">
                  <span class="badge" :class="riskBadge(a.riskLevel)" x-text="'Riesgo ' + (a.riskLevel || '—')"></span>
                  <span class="badge" :class="checkBadge(a.groundingStatus)" x-text="'Fidelidad: ' + (a.groundingStatus || '—')"></span>
                  <span class="badge" :class="checkBadge(a.complianceStatus)" x-text="'Cumplimiento: ' + (a.complianceStatus || '—')"></span>
                </div>
              </div>

              <div x-show="a._open" @click.stop class="article-detail">
                <div x-show="a.imageUrl">
                  <div class="article-detail-label">Imagen de la fuente</div>
                  <img :src="a.imageUrl" alt="" style="max-width:320px;max-height:220px;border-radius:8px;display:block;margin-bottom:12px;object-fit:cover;" />
                </div>

                <div class="article-detail-label">Resumen reescrito</div>
                <div class="article-detail-text" style="max-height:none;" x-text="a.rewrittenSummary"></div>

                <div class="article-detail-label">Contenido reescrito (editable)</div>
                <textarea class="input textarea" style="min-height:220px;" x-model="a._editedContent"></textarea>

                <div class="flex gap-2 mt-4" style="flex-wrap:wrap;">
                  <button class="btn btn-primary btn-sm" @click="validateArticle(a, 'VALIDADO')" :disabled="a._busy">
                    <span x-show="a._busy" class="spin"></span>
                    Aprobar
                  </button>
                  <button
                    class="btn btn-secondary btn-sm"
                    @click="validateArticle(a, 'EDITADO_Y_VALIDADO')"
                    :disabled="a._busy || a._editedContent === a.rewrittenContent"
                  >
                    Guardar edición y validar
                  </button>
                  <button class="btn btn-danger btn-sm" @click="validateArticle(a, 'RECHAZADO')" :disabled="a._busy">
                    Rechazar
                  </button>
                  <a class="btn btn-secondary btn-sm" :href="a.sourceUrl" target="_blank" rel="noopener" style="text-decoration:none;">
                    Ver fuente original
                  </a>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
