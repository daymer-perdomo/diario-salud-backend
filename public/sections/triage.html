      <p class="section-title">Triage</p>
      <p class="section-sub">Artículos que el pipeline automático no pudo resolver: fallo de fidelidad, fallo de cumplimiento o error técnico. Requieren decisión humana.</p>

      <div class="card">
        <div class="card-header">
          <span class="card-title" x-text="`${triage.length} artículo${triage.length !== 1 ? 's' : ''} en triage`"></span>
          <button class="btn btn-secondary btn-sm" @click="loadTriage()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Actualizar
          </button>
        </div>

        <div x-show="triageLoading" class="loader"><span class="spin dark"></span></div>

        <div x-show="!triageLoading && !triage.length" class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6L9 17l-5-5"/></svg>
          <p>No hay artículos pendientes de triage</p>
        </div>

        <div x-show="!triageLoading && triage.length">
          <template x-for="a in triage" :key="a.id">
            <div class="article-row" @click="a._open = !a._open">
              <div class="article-row-head">
                <div style="min-width:0;flex:1;">
                  <div class="flex items-center gap-2">
                    <svg class="chevron" :class="{ open: a._open }" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    <span class="article-title" x-text="a.rewrittenTitle || a.originalTitle"></span>
                  </div>
                  <div class="article-meta" x-text="`${a.sourceInstitution} · ${timeAgo(a.createdAt)} · intento de reescritura #${a.rewriteAttempts}`"></div>
                </div>
                <div class="article-badges">
                  <span class="badge" :class="stateBadge(a.state)" x-text="a.state"></span>
                </div>
              </div>

              <div x-show="a._open" @click.stop class="article-detail">
                <div x-show="a.imageUrl">
                  <div class="article-detail-label">Imagen de la fuente</div>
                  <img :src="a.imageUrl" alt="" style="max-width:320px;max-height:220px;border-radius:8px;display:block;margin-bottom:12px;object-fit:cover;" />
                </div>

                <template x-if="a.state === 'ERROR'">
                  <div>
                    <div class="article-detail-label">Etapa donde falló</div>
                    <p class="mb-3" x-text="a.errorStage"></p>
                    <div class="article-detail-label">Mensaje</div>
                    <div class="report-box" x-text="a.lastErrorMessage"></div>
                  </div>
                </template>

                <template x-if="a.state === 'GROUNDING_FALLIDO'">
                  <div>
                    <div class="article-detail-label">Reporte de fidelidad</div>
                    <div class="report-box" x-text="JSON.stringify(a.groundingReport, null, 2)"></div>
                  </div>
                </template>

                <template x-if="a.state === 'CUMPLIMIENTO_FALLIDO'">
                  <div>
                    <div class="article-detail-label">Reporte de cumplimiento</div>
                    <div class="report-box" x-text="JSON.stringify(a.complianceReport, null, 2)"></div>
                  </div>
                </template>

                <div class="flex gap-2 mt-4">
                  <button
                    class="btn btn-primary btn-sm"
                    @click="regenerate(a)"
                    :disabled="a._busy || a.state === 'ERROR'"
                    :title="a.state === 'ERROR' ? 'Un error técnico requiere revisión manual, no se puede regenerar automáticamente' : ''"
                  >
                    <span x-show="a._busy" class="spin"></span>
                    Regenerar reescritura
                  </button>
                  <a class="btn btn-secondary btn-sm" :href="a.sourceUrl" target="_blank" rel="noopener" style="text-decoration:none;">
                    Ver fuente original
                  </a>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
