# Render Blueprint -- crea junto los servicios web (Docker), Postgres y
# Key Value (Redis) para "Diario de la Salud". Al conectar el repo en
# Render (New -> Blueprint), esto aprovisiona todo automaticamente.
#
# Variables marcadas con `sync: false` NO se guardan en este archivo ni
# en git -- Render las pide una sola vez al crear el Blueprint. Hay que
# tenerlas a mano antes de aplicar este archivo (ver README/guia de
# deploy): GEMINI_API_KEY y el usuario/password inicial del panel.
#
# El plan del servicio web es "starter" (no el free tier) a proposito:
# preDeployCommand (usado aqui para correr las migraciones de Prisma) y
# el cron interno de ingesta programada requieren que el proceso este
# siempre corriendo, algo que el free tier de Render no garantiza.
#
# Staging y produccion son DOS servicios y DOS bases de datos totalmente
# separados -- probar cambios de pipeline/schema contra una base de datos
# de prueba antes de tocar la de produccion.
#
# El destino final de un articulo PUBLICADO sigue siendo nuestra propia API
# publica de solo lectura (GET /articles) -- eso no cambia. Ademas, desde
# 2026-08-03 el servicio de produccion tambien espejea cada articulo
# PUBLICADO hacia el WordPress real de EcoFarma (WordpressPublishService,
# variables WORDPRESS_*), reemplazando una automatizacion externa que
# cumplia este mismo rol y que nunca se logro localizar tras dejar de
# sincronizar articulos nuevos. Deliberadamente NO se configuran en
# staging: sin WORDPRESS_* el espejo se omite solo (no rompe el arranque),
# asi un deploy de prueba nunca puede publicar contenido de prueba en el
# WordPress real.

databases:
  - name: diario-salud-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
  - name: diario-salud-db-staging
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"

services:
  - name: diario-salud-redis
    type: keyvalue
    plan: starter
    region: virginia
    maxmemoryPolicy: noeviction
  - name: diario-salud-redis-staging
    type: keyvalue
    plan: starter
    region: virginia
    maxmemoryPolicy: noeviction

  - name: diario-salud-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: starter
    region: virginia
    healthCheckPath: /health
    # Migra el schema y corre el seed (idempotente, usa upsert) antes de
    # que el nuevo deploy reciba trafico -- si falla, Render mantiene la
    # version anterior corriendo.
    preDeployCommand: npx prisma migrate deploy && node dist/prisma/seed.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diario-salud-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: diario-salud-redis
          property: connectionString

      - key: NODE_ENV
        value: production

      # Secretos generados automaticamente por Render -- nunca viven en git.
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_KEY
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: GEMINI_MODEL
        value: "gemini-3.1-flash-lite"

      # Estos SI requieren un valor real tuyo -- Render los pide al crear
      # el Blueprint (una sola vez; para cambiarlos despues, editalos en
      # el dashboard del servicio, no aqui).
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # Espejo hacia el WordPress real de EcoFarma (ver WordpressPublishService).
      # WORDPRESS_USERNAME/APP_PASSWORD son una Application Password de
      # WordPress (Usuarios > Perfil > Contrasenas de aplicacion), nunca la
      # contrasena real de la cuenta -- se puede anular ahi sin tocar nada mas.
      - key: WORDPRESS_BASE_URL
        value: "https://ecofarma.co"
      - key: WORDPRESS_CATEGORY_ID
        value: "2861"
      - key: WORDPRESS_USERNAME
        sync: false
      - key: WORDPRESS_APP_PASSWORD
        sync: false

  # Copia identica del servicio de produccion, apuntando a su propia DB/
  # Redis. Desplegar y validar aqui primero siempre.
  - name: diario-salud-backend-staging
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: starter
    region: virginia
    healthCheckPath: /health
    preDeployCommand: npx prisma migrate deploy && node dist/prisma/seed.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diario-salud-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: diario-salud-redis-staging
          property: connectionString

      - key: NODE_ENV
        value: staging

      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_KEY
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: GEMINI_MODEL
        value: "gemini-3.1-flash-lite"

      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
