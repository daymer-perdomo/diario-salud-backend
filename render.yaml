# Render Blueprint -- crea junto el servicio web (Docker), Postgres y
# Key Value (Redis) para "Diario de la Salud". Al conectar el repo en
# Render (New -> Blueprint), esto aprovisiona todo automaticamente.
#
# Variables marcadas con `sync: false` NO se guardan en este archivo ni
# en git -- Render las pide una sola vez al crear el Blueprint. Hay que
# tenerlas a mano antes de aplicar este archivo (ver README/guia de
# deploy): ANTHROPIC_API_KEY, credenciales de WordPress, y el usuario/
# password inicial del panel.
#
# El plan del servicio web es "starter" (no el free tier) a proposito:
# preDeployCommand (usado aqui para correr las migraciones de Prisma) y
# el cron interno de ingesta programada requieren que el proceso este
# siempre corriendo, algo que el free tier de Render no garantiza.

databases:
  - name: diario-salud-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"

services:
  - name: diario-salud-redis
    type: keyvalue
    plan: starter
    region: virginia
    maxmemoryPolicy: noeviction

  - name: diario-salud-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: starter
    region: virginia
    healthCheckPath: /health
    # Migra el schema y corre el seed (idempotente, usa upsert) antes de
    # que el nuevo deploy reciba trafico -- si falla, Render mantiene la
    # version anterior corriendo.
    preDeployCommand: npx prisma migrate deploy && node dist/prisma/seed.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diario-salud-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: diario-salud-redis
          property: connectionString

      - key: NODE_ENV
        value: production

      # Secretos generados automaticamente por Render -- nunca viven en git.
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_KEY
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: ANTHROPIC_MODEL
        value: "claude-sonnet-5"
      - key: WORDPRESS_BASE_URL
        value: "https://ecofarma.co"

      # Estos SI requieren un valor real tuyo -- Render los pide al crear
      # el Blueprint (una sola vez; para cambiarlos despues, editalos en
      # el dashboard del servicio, no aqui).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WORDPRESS_APP_USERNAME
        sync: false
      - key: WORDPRESS_APP_PASSWORD
        sync: false
      - key: WORDPRESS_DIARIO_SALUD_CATEGORY_ID
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
